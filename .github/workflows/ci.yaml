name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Format, lint, type-check, shell, and Makefile checks, run through the same
  # pre-commit config used locally so CI and the working tree agree. Shell is
  # both formatted (shfmt) and linted (shellcheck) here.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # rain formats the CFN/SAM templates; the pre-commit hook is language:system
      # so the binary must be on PATH here too. Pinned to the author's local version
      # so CI and the working tree format identically.
      - name: install rain (CloudFormation formatter)
        run: |
          curl -fsSL -o /tmp/rain.zip \
            https://github.com/aws-cloudformation/rain/releases/download/v1.24.3/rain-v1.24.3_linux-amd64.zip
          unzip -q -j /tmp/rain.zip '*/rain' -d /tmp/rain-bin
          sudo install /tmp/rain-bin/rain /usr/local/bin/rain
          rain --version
      - name: pre-commit (ruff, ty, shfmt, shellcheck, mbake)
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # Secrets, over the whole history rather than the working tree. The pre-commit
  # hook only sees staged changes, so it is a no-op under `pre-commit run
  # --all-files` in the quality job above; this is the check that would catch a key
  # committed once and deleted later. fetch-depth 0 is what makes the history
  # visible; the scan takes about a second for this repo.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.29.0/gitleaks_8.29.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: scan git history
        run: gitleaks git --redact --no-banner .

  # Byte-compile the chapter code on each supported Python so a version-specific
  # syntax error (for example the 3.14-only bracketless except) fails loudly
  # rather than only surfacing on a reader's machine. This is a syntax check; it
  # does not install dependencies or import the modules.
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: byte-compile code/
        run: |
          python -m compileall -q \
            -x '(\.aws-sam|\.ruff_cache|\.venv|__pycache__)' \
            code

  # Every chapter that has a tests/ directory, one job each so a failure names
  # the chapter. Each suite declares its own dependencies in the chapter's
  # `make test` line, and the ones that need a database or DynamoDB Local
  # provision their own container through docker-py, which the runners provide.
  # Add a chapter here when it grows a tests/ directory.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter:
          - ch-01-data-engineering
          - ch-02-mlops
          - ch-03-generative-ai
          - ch-04-realtime-scoring
          - ch-07-vision-rag
          - ch-09-underwriting-kb
          - ch-10-conversation-classification
          - ch-11-model-monitoring
          - ch-12-model-governance
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ${{ matrix.chapter }} test suite
        working-directory: code/${{ matrix.chapter }}
        run: make test
