# Custom (non-AWS-service) icons shared across the book's diagrams, kept in the
# repo so figures reproduce from source. Icon paths resolve from the chapter
# directory, where `make diagrams` runs awsdac (so ../../assets from code/ch-NN/).
# SVG sources live beside the PNGs; `make diagrams` re-renders the PNGs awsdac
# consumes. Presets:
#   - Strands / LambdaCoin: the agent mark and the classic AWS Lambda coin.
#   - MinIO, MLflow, Ollama, Postgres, Iceberg, Trino, FastAPI, OpenSearch: local-stack tools (SVG).
Definitions:
  CustomIcons:
    Type: Directory
    Directory:
      Path: "../../assets/diagrams/icons/"
  Strands:
    Type: Preset
    Icon: {Source: CustomIcons, Path: "strands.png"}
    Label: {Title: "Strands", Color: "rgba(0, 0, 0, 255)"}
  LambdaCoin:
    Type: Preset
    Icon: {Source: CustomIcons, Path: "lambda-coin.png"}
    Label: {Title: "AWS Lambda", Color: "rgba(0, 0, 0, 255)"}
