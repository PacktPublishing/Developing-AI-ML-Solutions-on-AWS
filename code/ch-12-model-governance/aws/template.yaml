AWSTemplateFormatVersion: "2010-09-09"

Description: |
  ch-12 governance stack: the AWS AppConfig application, environment, and feature-flag
  configuration that drives the champion/challenger rollout, plus the ECR repository for
  the gateway image. The challenger_rollout flag carries the same split rule the local
  agent evaluates; the AppConfig agent sidecar on the Fargate service reads it here. Flip
  the rollout by updating RolloutPct and redeploying the stack (a new configuration
  version and deployment); the running service is untouched.

Parameters:
  RolloutPct:
    Description: percent of applications routed to the challenger
    Type: Number
    Default: 20
    MinValue: 0
    MaxValue: 100

Resources:

  # The gateway image. EmptyOnDelete lets the stack delete cleanly with images pushed.
  GatewayRepo:
    DeletionPolicy: Delete
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ch12-rollout-gateway
      EmptyOnDelete: true

  Application:
    Type: AWS::AppConfig::Application
    Properties:
      Name: credit-governance

  Environment:
    Type: AWS::AppConfig::Environment
    Properties:
      ApplicationId: !Ref Application
      Name: prod

  Profile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref Application
      Name: rollout
      LocationUri: hosted
      Type: AWS.AppConfig.FeatureFlags

  # The feature-flag document in the AWS.AppConfig.FeatureFlags schema. $loanId is an
  # AppConfig context variable (no braces, so Sub leaves it alone); RolloutPct is injected.
  ConfigVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      ApplicationId: !Ref Application
      ConfigurationProfileId: !Ref Profile
      ContentType: application/json

      # A flag value that uses _variants must NOT carry a top-level "enabled" (that trips
      # the StrictVariants check); enabled goes on each variant. challenger overrides the
      # model for its split segment, champion is the complement (no override), default is
      # the required catch-all (unreachable, since split and not-split are exhaustive).
      Content: !Sub |
        {
          "version": "1",
          "flags": {
            "challenger_rollout": {
              "name": "challenger_rollout",
              "description": "Route a share of applications to the challenger model.",
              "attributes": { "model": { "constraints": { "type": "string", "required": false } } }
            }
          },
          "values": {
            "challenger_rollout": {
              "_variants": [
                {
                  "name": "challenger",
                  "enabled": true,
                  "rule": "(split by::$loanId pct::${RolloutPct} seed::\"rollout-2026\")",
                  "attributeValues": { "model": "credit-challenger" }
                },
                {
                  "name": "champion",
                  "enabled": true,
                  "rule": "(not (split by::$loanId pct::${RolloutPct} seed::\"rollout-2026\"))"
                },
                {
                  "name": "default",
                  "enabled": true
                }
              ]
            }
          }
        }

  # Immediate rollout: this is a routing flag, not a risky binary, so deploy all at once.
  DeploymentStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Properties:
      Name: ch12-all-at-once
      DeploymentDurationInMinutes: 0
      GrowthFactor: 100
      FinalBakeTimeInMinutes: 0
      ReplicateTo: NONE

  Deployment:
    Type: AWS::AppConfig::Deployment
    Properties:
      ApplicationId: !Ref Application
      EnvironmentId: !Ref Environment
      ConfigurationProfileId: !Ref Profile
      ConfigurationVersion: !Ref ConfigVersion
      DeploymentStrategyId: !Ref DeploymentStrategy

  # The two models the gateway routes between: chapter 2's scorecard and challenger, each
  # on its serving image behind a Serverless Inference endpoint. Deployed once and never
  # touched; only the AppConfig flag moves, so a rollout is not a redeploy.
  EndpointRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: serve
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::sagemaker-${AWS::Region}-${AWS::AccountId}/ch12/*
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/ch12-*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*

  ChampionModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !GetAtt EndpointRole.Arn
      PrimaryContainer:
        Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ch12-champion:latest
        ModelDataUrl: !Sub s3://sagemaker-${AWS::Region}-${AWS::AccountId}/ch12/champion-pl/model.tar.gz
        Mode: SingleModel

  ChallengerModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !GetAtt EndpointRole.Arn
      PrimaryContainer:
        Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ch12-challenger:latest
        ModelDataUrl: !Sub s3://sagemaker-${AWS::Region}-${AWS::AccountId}/ch12/challenger-cb/model.tar.gz
        Mode: SingleModel

  ChampionEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: main
          ModelName: !GetAtt ChampionModel.ModelName
          ServerlessConfig:
            MemorySizeInMB: 3072
            MaxConcurrency: 2

  ChallengerEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: main
          ModelName: !GetAtt ChallengerModel.ModelName
          ServerlessConfig:
            MemorySizeInMB: 3072
            MaxConcurrency: 2

  ChampionEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: ch12-champion
      EndpointConfigName: !GetAtt ChampionEndpointConfig.EndpointConfigName

  ChallengerEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: ch12-challenger
      EndpointConfigName: !GetAtt ChallengerEndpointConfig.EndpointConfigName

Outputs:
  ApplicationId:
    Description: the AppConfig application id (for the agent sidecar)
    Value: !Ref Application

  ChampionEndpoint:
    Description: the champion (credit-scorecard) endpoint
    Value: !GetAtt ChampionEndpoint.EndpointName

  ChallengerEndpoint:
    Description: the challenger (credit-challenger) endpoint
    Value: !GetAtt ChallengerEndpoint.EndpointName

  RepositoryUri:
    Description: the ECR repository for the gateway image
    Value: !GetAtt GatewayRepo.RepositoryUri
