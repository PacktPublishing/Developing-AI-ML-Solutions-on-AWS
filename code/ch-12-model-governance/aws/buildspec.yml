version: 0.2

# A batch build: the three serving images build in parallel, one child build per image.
# Each child gets its context directory and repository from the build-list; ECR_REGISTRY
# and TAG come from the CodeBuild project, TAG per build. Each image is pushed under
# that tag and under latest: latest is for a person reading the console, and the unique
# tag is what the stack deploys, because CloudFormation replaces a model when its
# parameters change and :latest never changes. The contexts sit at the zip root beside
# this file (scorecard/, challenger/, gateway/).
batch:
  fast-fail: false
  build-list:
    - identifier: champion
      env:
        variables:
          CONTEXT: scorecard
          REPO: ch12-champion
    - identifier: challenger
      env:
        variables:
          CONTEXT: challenger
          REPO: ch12-challenger
    - identifier: gateway
      env:
        variables:
          CONTEXT: gateway
          REPO: ch12-rollout-gateway

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build -t "$ECR_REGISTRY/$REPO:$TAG" -t "$ECR_REGISTRY/$REPO:latest" "$CONTEXT/"
  post_build:
    commands:
      - docker push "$ECR_REGISTRY/$REPO:$TAG"
      - docker push "$ECR_REGISTRY/$REPO:latest"
