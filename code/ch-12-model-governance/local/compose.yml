# The local rollout stack: the two chapter-2 models behind the flag-routing gateway.
# champion (WOE scorecard) and challenger (monotone XGBoost) are chapter 2's own
# serving images, each mounting its trained artifact; the gateway routes between them
# by the challenger_rollout flag, read from the mounted flag store on every request --
# so `make flip` widens the rollout with nothing restarted.
services:
  champion:
    image: ch02-scorecard:latest
    command: serve
    volumes:
      - ../../ch-02-mlops/runs-local/model:/opt/ml/model:ro

  challenger:
    image: ch02-challenger:latest
    command: serve
    volumes:
      - ../../ch-02-mlops/runs-local/model-challenger:/opt/ml/model:ro

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APPCONFIG_LOCAL: "1"
      APPCONFIG_FLAGS: /app/flags/feature-flags.json
      CHAMPION_URL: http://champion:8080/invocations
      CHALLENGER_URL: http://challenger:8080/invocations
    volumes:
      - ./flags:/app/flags:ro
    ports:
      - "8080:8080"
    depends_on:
      - champion
      - challenger
