AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Airflow on EC2 for the data engineering chapter: one free-tier instance running
  Airflow (Postgres metadata + LocalExecutor) and redshift-local under docker
  compose, with the bureau pipeline DAG installed and a nightly pg_dump of Airflow's
  metadata to S3. Deploy with: sam deploy --guided

Parameters:
  AllowedCidr:
    Description: Your IP in CIDR form (x.x.x.x/32) for the Airflow UI
    Type: String

  InstanceType:

    # Airflow 3 standalone plus metadata Postgres and redshift-local need real memory; t3.medium (4 GB) is the smallest that works reliably.
    Type: String
    Default: t3.medium

  SubnetId:
    Description: Subnet to launch into; empty uses the default VPC's default subnet
    Type: String
    Default: ""

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  SourceUri:
    Description: S3 URI of the packaged chapter source (set by `make airflow-deploy`); the instance unpacks it and runs the same DAG file as the local stack
    Type: String

  WarehouseMode:
    Description: local runs redshift-local on the instance (free tier, mirrors the local stack); serverless provisions Amazon Redshift Serverless in this same stack and points the DAG at it (standard-plan account)
    Type: String
    AllowedValues:
      - local
      - serverless
    Default: local

  WorkgroupSubnetIds:
    Description: Subnets for the Redshift Serverless workgroup (>= 3, across AZs). Required only when WarehouseMode=serverless; ignored for local.
    Type: CommaDelimitedList
    Default: ""

Conditions:
  HasSubnet: !Not
    - !Equals
      - !Ref SubnetId
      - ""

  UseServerless: !Equals
    - !Ref WarehouseMode
    - serverless

Resources:

  # Off-instance home for the metadata dumps: the EC2 volume dies with the
  # instance, so Airflow's run history and connections live here instead.
  BackupBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            ExpirationInDays: 30

  # Where the seed step drops the raw bureau files and the load step reads them:
  # on the laptop this is a bucket inside S3Proxy, here it is the real thing.
  BureauRawBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # The SageMaker Feature Store offline store (Iceberg-format Parquet lands here);
  # emptied by `make airflow-delete` before the stack is torn down.
  FeatureStoreOfflineBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # The role the feature group assumes to write the offline store and register its
  # Glue catalog table (distinct from the EC2 instance role).
  FeatureStoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFeatureStoreAccess
      Policies:
        - PolicyName: offline-store-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt FeatureStoreOfflineBucket.Arn
                  - !Sub ${FeatureStoreOfflineBucket.Arn}/*

  AirflowInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: airflow-backup-to-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${BackupBucket.Arn}/airflow-metadata/*
        - PolicyName: source-and-raw-objects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # the packaged chapter source, unpacked at boot
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - arn:aws:s3:::${Rest}
                  - Rest: !Select
                      - 1
                      - !Split
                        - s3://
                        - !Ref SourceUri

              # the raw bureau drops the seed step writes and the load step reads
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt BureauRawBucket.Arn
                  - !Sub ${BureauRawBucket.Arn}/*
        - PolicyName: feature-store-ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:CreateFeatureGroup
                  - sagemaker:DescribeFeatureGroup
                  - sagemaker:PutRecord
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: sagemaker.amazonaws.com

              # registering the offline store's Glue catalog table runs as this role
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:CreateDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/sagemaker_featurestore
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/sagemaker_featurestore/*

  AirflowInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AirflowInstanceRole

  AirflowSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Airflow UI access from one address
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref AllowedCidr

  # -----------------------------------------------------------------------------
  # Redshift Serverless: WarehouseMode=serverless only
  # -----------------------------------------------------------------------------
  # The managed warehouse the DAG targets on a standard plan; everything here is gated behind UseServerless, so a `local` deploy carries none of it.
  # The admin password is generated into Secrets Manager and the DAG fetches it at run time via the instance role, so no secret is baked into UserData.
  WarehouseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Redshift Serverless admin password for ch01-airflow
      GenerateSecretString:
        SecretStringTemplate: '{"username": "bureau_admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
    Condition: UseServerless

  WarehouseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redshift Serverless reachable from the Airflow instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5439
          ToPort: 5439
          SourceSecurityGroupId: !GetAtt AirflowSecurityGroup.GroupId
    Condition: UseServerless

  WarehouseNamespace:
    Type: AWS::RedshiftServerless::Namespace
    Properties:
      NamespaceName: ch01-bureau
      DbName: bureau
      AdminUsername: bureau_admin
      AdminUserPassword: !Sub '{{resolve:secretsmanager:${WarehouseSecret}:SecretString:password}}'
    Condition: UseServerless

  WarehouseWorkgroup:
    Type: AWS::RedshiftServerless::Workgroup
    Properties:
      WorkgroupName: ch01-bureau
      NamespaceName: !Ref WarehouseNamespace
      BaseCapacity: 8
      PubliclyAccessible: false
      SubnetIds: !Ref WorkgroupSubnetIds
      SecurityGroupIds:
        - !GetAtt WarehouseSecurityGroup.GroupId
    Condition: UseServerless

  # let the instance role read just the generated warehouse secret
  WarehouseSecretAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: read-warehouse-secret
      Roles:
        - !Ref AirflowInstanceRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref WarehouseSecret
    Condition: UseServerless

  AirflowInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AirflowInstanceProfile
      SubnetId: !If
        - HasSubnet
        - !Ref SubnetId
        - !Ref AWS::NoValue
      SecurityGroupIds:
        - !GetAtt AirflowSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: ch01-airflow
      UserData: !Base64
        Fn::Sub:
          - |
            #!/bin/bash
            dnf install -y docker cronie
            systemctl enable --now docker crond
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -sL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            # Unpack the chapter source: the deployed stack runs the same scripts and
            # the same DAG file as the laptop, so nothing here is a cloud-only copy.
            mkdir -p /opt/af/work
            aws s3 cp ${SourceUri} /opt/af/src.tar.gz
            tar xzf /opt/af/src.tar.gz -C /opt/af/work
            chown -R 50000:0 /opt/af/work
            # Warehouse credentials: on a serverless deploy they come from the
            # generated secret, so the DAG never carries them. A local deploy leaves
            # the file empty and the DAG's redshift-local defaults stand.
            : > /opt/af/warehouse.env
            if [ -n "${SecretArn}" ]; then
              SECRET=$(aws secretsmanager get-secret-value --secret-id ${SecretArn} \
                --query SecretString --output text)
              WU=$(echo "$SECRET" | python3 -c 'import sys,json;print(json.load(sys.stdin)["username"])')
              WP=$(echo "$SECRET" | python3 -c 'import sys,json;print(json.load(sys.stdin)["password"])')
              cat > /opt/af/warehouse.env <<EOF
            WAREHOUSE_USER=$WU
            WAREHOUSE_PASSWORD=$WP
            WAREHOUSE_DSN=postgresql://$WU:$WP@${WarehouseHost}:5439/bureau
            DESTINATION__REDSHIFT__CREDENTIALS__HOST=${WarehouseHost}
            DESTINATION__REDSHIFT__CREDENTIALS__USERNAME=$WU
            DESTINATION__REDSHIFT__CREDENTIALS__PASSWORD=$WP
            EOF
            fi
            cat > /opt/af/compose.yml <<'YML'
            services:
              # Airflow's own metadata store: real Postgres, so the scheduler can run
              # LocalExecutor and tasks run in parallel, not the single-threaded
              # SQLite + SequentialExecutor Airflow falls back to by default.
              metadata:
                image: postgres:16
                container_name: af-metadata
                restart: unless-stopped
                environment:
                  - POSTGRES_USER=airflow
                  - POSTGRES_PASSWORD=airflow
                  - POSTGRES_DB=airflow
                volumes:
                  - af-metadata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U airflow"]
                  interval: 5s
                  timeout: 3s
                  retries: 20
              # the DAG's target warehouse (redshift-local), separate from metadata
              warehouse:
                image: public.ecr.aws/oblako/redshift-local:16
                restart: unless-stopped
                environment:
                  - POSTGRES_USER=loader
                  - POSTGRES_PASSWORD=loader
                  - POSTGRES_DB=bureau
                  - POSTGRES_HOST_AUTH_METHOD=md5
              airflow:
                image: apache/airflow:3.3.0
                command: standalone
                restart: unless-stopped
                environment:
                  - AIRFLOW__CORE__LOAD_EXAMPLES=False
                  - AIRFLOW__CORE__EXECUTOR=LocalExecutor
                  - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@metadata/airflow
                  # local mode leaves these empty and the DAG uses redshift-local;
                  # serverless mode fills them and the DAG targets Redshift Serverless
                  - WAREHOUSE_SECRET_ARN=${SecretArn}
                  - WAREHOUSE_HOST=${WarehouseHost}
                  - AWS_DEFAULT_REGION=${AWS::Region}
                  # serverless mode: the ingest task writes the mart into the
                  # SageMaker Feature Store (online store + offline S3 store)
                  - FEATURE_GROUP=${FeatureGroup}
                  - OFFLINE_S3_URI=${OfflineS3Uri}
                  - FEATURE_STORE_ROLE_ARN=${FeatureStoreRoleArn}
                  # the raw landing zone the seed and load steps use
                  - RAW_BUCKET=${RawBucket}
                  # nightly on the deployed stack; unscheduled on the laptop
                  - DAG_SCHEDULE=@daily
                  # uv runs the chapter's scripts and uvx runs dbt, exactly as locally
                  - _PIP_ADDITIONAL_REQUIREMENTS=uv
                env_file:
                  - /opt/af/warehouse.env
                ports:
                  - "8080:8080"
                volumes:
                  - /opt/af/work:/work
                  - /opt/af/work/local/airflow-dags:/opt/airflow/dags
                depends_on:
                  metadata:
                    condition: service_healthy
                  warehouse:
                    condition: service_started
            volumes:
              af-metadata:
            YML
            cd /opt/af && docker compose up -d
            # nightly backup: dump the Airflow metadata DB and stream it to S3 (the
            # aws-cli container inherits the instance role, so no host install/creds)
            cat > /opt/af/backup.sh <<'BK'
            #!/bin/bash
            set -euo pipefail
            TS=$(date -u +%Y%m%dT%H%M%SZ)
            /usr/bin/docker exec af-metadata pg_dump -U airflow airflow | gzip | \
              /usr/bin/docker run --rm -i amazon/aws-cli \
                s3 cp - "s3://${BackupBucket}/airflow-metadata/airflow-$TS.sql.gz"
            BK
            chmod +x /opt/af/backup.sh
            echo "0 3 * * * root /opt/af/backup.sh >> /var/log/af-backup.log 2>&1" > /etc/cron.d/af-backup
          - SecretArn: !If
              - UseServerless
              - !Ref WarehouseSecret
              - ""
            WarehouseHost: !If
              - UseServerless
              - !GetAtt WarehouseWorkgroup.Workgroup.Endpoint.Address
              - ""
            FeatureGroup: applicant-credit-profile-fg
            OfflineS3Uri: !Sub s3://${FeatureStoreOfflineBucket}/offline/
            FeatureStoreRoleArn: !GetAtt FeatureStoreRole.Arn
            RawBucket: !Ref BureauRawBucket
            SourceUri: !Ref SourceUri

Outputs:
  AirflowUrl:
    Description: Airflow UI (login admin; Airflow 3 standalone prints the generated password to the container logs and simple_auth_manager_passwords.json.generated)
    Value: !Sub http://${AirflowInstance.PublicDnsName}:8080

  BackupBucket:
    Description: S3 bucket holding the nightly Airflow metadata dumps
    Value: !Ref BackupBucket

  OfflineBucket:
    Description: S3 bucket holding the SageMaker Feature Store offline store
    Value: !Ref FeatureStoreOfflineBucket

  RawBucket:
    Description: S3 bucket holding the raw bureau drops the DAG seeds and loads
    Value: !Ref BureauRawBucket

  WarehouseEndpoint:
    Description: Redshift Serverless workgroup endpoint the DAG targets
    Value: !GetAtt WarehouseWorkgroup.Workgroup.Endpoint.Address
    Condition: UseServerless
