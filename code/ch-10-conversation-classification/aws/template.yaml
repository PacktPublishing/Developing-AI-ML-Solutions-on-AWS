AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Conversation classification on Amazon Bedrock batch inference: an S3 bucket for
  the JSONL manifests and .jsonl.out results, and the service role Bedrock assumes
  to read the input and write the output. The classifier submits a
  CreateModelInvocationJob against this bucket and role; routing publishes each
  result to an SNS topic per team (topics are created at run time, one per
  category). Nothing runs at rest -- batch bills per token, roughly half on-demand.

Parameters:
  WithDecider:
    Description: |
      Deploy the decision-model router beside the batch LLM baseline. It is off by
      default because it provisions a VPC and GPU EC2 instances in your account,
      which bill by the hour while a session is alive.
    Type: String
    AllowedValues:
      - "false"
      - "true"
    Default: "false"

  DeciderImageUri:
    Description: The image built by `make image`; empty until the first build.
    Type: String
    Default: ""

  DeciderInstanceType:
    Description: |
      The endpoint instance. GPU, because CPU inference of this model peaks at
      7.4 GB and takes seconds per conversation. ml.g5.xlarge has an endpoint
      quota of its own, separate from the EC2 one.
    Type: String
    Default: ml.g5.xlarge

  AgentCodeKey:
    Description: The agent zip in the source bucket; empty until `make agent`.
    Type: String
    Default: ""

Conditions:
  DeployDecider: !Equals
    - !Ref WithDecider
    - "true"

  # The endpoint needs an image the repository in this same stack holds, so it
  # appears on the second deploy, after `make image`.
  DeciderReady: !And
    - !Condition DeployDecider
    - !Not
      - !Equals
        - !Ref DeciderImageUri
        - ""

  # The agent needs its zip uploaded, which `make agent` does.
  AgentReady: !And
    - !Condition DeciderReady
    - !Not
      - !Equals
        - !Ref AgentCodeKey
        - ""

Resources:
  BatchBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ch10-batch-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Bedrock assumes this role to read the input manifests and write the outputs.
  # The SourceAccount / SourceArn conditions scope it to this account's batch jobs.
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ch10-batch-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:model-invocation-job/*
      Policies:
        - PolicyName: batch-io-and-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BatchBucket.Arn
                  - !Sub ${BatchBucket.Arn}/*

              # The batch job invokes the model as this role, so it needs
              # InvokeModel on the model (and the region-less ARN a global
              # inference profile resolves to for the permission check).
              - Sid: Invoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - arn:aws:bedrock:::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

  # ---------------------------------------------------------------------------
  # Two services, split by what each is for. SageMaker hosts the decision model,
  # which is a 2B model on a GPU instance. AgentCore Runtime hosts the agent that
  # owns the routing policy, which is a few kilobytes on a serverless microVM.
  #
  # The split is not a preference. Measured locally: the model needs a 9.39 GB
  # image with CUDA torch, against AgentCore's 2 GB limit, and 7.4 GB of memory
  # on CPU, against a microVM's 8 GB session. The agent fits a microVM easily.
  # ---------------------------------------------------------------------------
  DeciderRepo:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ch10-decider
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
    Condition: DeployDecider

  SourceBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ch10-decider-src-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    Condition: DeployDecider

  ImageBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${SourceBucket.Arn}/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt DeciderRepo.Arn
    Condition: DeployDecider

  # The image carries CUDA torch and the weights, so the build is long and the
  # disk is large. BUILD_GENERAL1_LARGE rather than MEDIUM for that reason.
  ImageBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ch10-decider-build
      ServiceRole: !GetAtt ImageBuildRole.Arn
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/src.zip
      Artifacts:
        Type: NO_ARTIFACTS
      TimeoutInMinutes: 60
      Environment:
        ComputeType: BUILD_GENERAL1_LARGE
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPO
            Value: !GetAtt DeciderRepo.RepositoryUri
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
    Condition: DeployDecider

  # ---- the model, on SageMaker ----------------------------------------------
  EndpointRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: serve
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt DeciderRepo.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*
    Condition: DeployDecider

  DeciderModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !GetAtt EndpointRole.Arn
      PrimaryContainer:
        Image: !Ref DeciderImageUri
        Mode: SingleModel
    Condition: DeciderReady

  DeciderEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: main
          ModelName: !GetAtt DeciderModel.ModelName
          InitialInstanceCount: 1
          InstanceType: !Ref DeciderInstanceType
          InitialVariantWeight: 1

          # The image pulls 4.5 GB of weights with it, so give the container
          # longer than the default to report healthy.
          ContainerStartupHealthCheckTimeoutInSeconds: 900
    Condition: DeciderReady

  DeciderEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: ch10-decider
      EndpointConfigName: !GetAtt DeciderEndpointConfig.EndpointConfigName
    Condition: DeciderReady

  # ---- the agent, on AgentCore ----------------------------------------------
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # The only thing the agent may do: ask this one endpoint.
              - Effect: Allow
                Action: sagemaker:InvokeEndpoint
                Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/ch10-decider
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${SourceBucket.Arn}/*
    Condition: DeployDecider

  # Direct code deployment, not a container: the agent is small enough for the
  # 250 MB zip, so it needs no repository and no build. The name takes
  # underscores, not hyphens.
  RoutingAgent:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: ch10_router
      Description: Routes a conversation to a team, asking the model on SageMaker
      RoleArn: !GetAtt AgentRole.Arn
      ProtocolConfiguration: HTTP
      AgentRuntimeArtifact:
        CodeConfiguration:
          Runtime: PYTHON_3_12
          EntryPoint:
            - main.py
          Code:
            S3:
              Bucket: !Ref SourceBucket
              Prefix: !Ref AgentCodeKey
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        ENDPOINT_NAME: ch10-decider
    Condition: AgentReady

Outputs:
  BatchBucket:
    Value: !Ref BatchBucket

  BatchServiceRoleArn:
    Value: !GetAtt BatchServiceRole.Arn

  RoutingAgentArn:
    Description: Pass as AGENT_RUNTIME_ARN to src/decide.py
    Value: !GetAtt RoutingAgent.AgentRuntimeArn
    Condition: AgentReady

  DeciderEndpointName:
    Description: the SageMaker endpoint the agent asks
    Value: !GetAtt DeciderEndpoint.EndpointName
    Condition: DeciderReady

  DeciderRepoUri:
    Value: !GetAtt DeciderRepo.RepositoryUri
    Condition: DeployDecider

  DeciderSourceBucket:
    Value: !Ref SourceBucket
    Condition: DeployDecider
