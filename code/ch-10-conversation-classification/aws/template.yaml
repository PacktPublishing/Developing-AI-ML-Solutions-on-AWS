AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Conversation classification on Amazon Bedrock batch inference: an S3 bucket for
  the JSONL manifests and .jsonl.out results, and the service role Bedrock assumes
  to read the input and write the output. The classifier submits a
  CreateModelInvocationJob against this bucket and role; routing publishes each
  result to an SNS topic per team (topics are created at run time, one per
  category). Nothing runs at rest -- batch bills per token, roughly half on-demand.

Parameters:
  WithDecider:
    Description: |
      Deploy the decision-model router beside the batch LLM baseline. It is off by
      default because it provisions a VPC and GPU EC2 instances in your account,
      which bill by the hour while a session is alive.
    Type: String
    AllowedValues:
      - "false"
      - "true"
    Default: "false"

  DeciderImageUri:
    Description: The image built by `make image`; empty until the first build.
    Type: String
    Default: ""

  DeciderInstanceTypes:
    Description: |
      GPU instance types the capacity provider may launch, most wanted first.
      AgentCore supports g4dn, g5, g6, g6e, gr6, g6f, gr6f, g7e and inf2 only, and
      GPU capacity is often short, so more than one type is listed on purpose.
    Type: CommaDelimitedList
    Default: g6.xlarge,g5.xlarge

Conditions:
  DeployDecider: !Equals
    - !Ref WithDecider
    - "true"

  # The runtime needs an image the repository in this same stack holds, so it
  # appears on the second deploy, after `make image`. The first deploy builds
  # everything the build itself needs.
  DeciderReady: !And
    - !Condition DeployDecider
    - !Not
      - !Equals
        - !Ref DeciderImageUri
        - ""

Transform: AWS::Serverless-2016-10-31

Resources:
  BatchBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ch10-batch-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Bedrock assumes this role to read the input manifests and write the outputs.
  # The SourceAccount / SourceArn conditions scope it to this account's batch jobs.
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ch10-batch-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:model-invocation-job/*
      Policies:
        - PolicyName: batch-io-and-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BatchBucket.Arn
                  - !Sub ${BatchBucket.Arn}/*

              # The batch job invokes the model as this role, so it needs
              # InvokeModel on the model (and the region-less ARN a global
              # inference profile resolves to for the permission check).
              - Sid: Invoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - arn:aws:bedrock:::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

  # ---------------------------------------------------------------------------
  # The decision-model router. AgentCore Runtime's Instances compute type, which
  # is the only one that offers GPUs, and the only one this model fits: a
  # container image stops at 2 GB where CUDA torch alone is 4.2 GB, and a microVM
  # session caps at 8 GB where CPU inference peaks at 7.4 GB.
  # ---------------------------------------------------------------------------
  DeciderVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ch10-decider
    Condition: DeployDecider

  DeciderIgw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: ch10-decider
    Condition: DeployDecider

  DeciderIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DeciderVpc
      InternetGatewayId: !Ref DeciderIgw
    Condition: DeployDecider

  # Two subnets in different zones: GPU capacity runs out in one zone often
  # enough that a single-subnet capacity provider is a deploy that fails for a
  # reason nobody can fix by retrying.
  DeciderSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DeciderVpc
      CidrBlock: 10.60.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs
      MapPublicIpOnLaunch: true
    Condition: DeployDecider

  DeciderSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DeciderVpc
      CidrBlock: 10.60.2.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs
      MapPublicIpOnLaunch: true
    Condition: DeployDecider

  DeciderRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DeciderVpc
    Condition: DeployDecider

  # Public subnets with an internet gateway rather than private subnets behind
  # NAT: the instance pulls torch and the weights at session start, and a NAT
  # gateway bills by the hour whether or not a session is alive.
  DeciderRoute:
    Type: AWS::EC2::Route
    DependsOn: DeciderIgwAttachment
    Properties:
      RouteTableId: !Ref DeciderRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DeciderIgw
    Condition: DeployDecider

  DeciderSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DeciderSubnetA
      RouteTableId: !Ref DeciderRouteTable
    Condition: DeployDecider

  DeciderSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DeciderSubnetB
      RouteTableId: !Ref DeciderRouteTable
    Condition: DeployDecider

  DeciderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress only; AgentCore reaches the agent, nothing else does
      VpcId: !Ref DeciderVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Pull the image, torch and the weights at session start
    Condition: DeployDecider

  DeciderRepo:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ch10-decider
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
    Condition: DeployDecider

  SourceBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ch10-decider-src-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    Condition: DeployDecider

  # The image is built in the account by CodeBuild, not pushed from a laptop, so
  # the x86_64 GPU image does not depend on what the author's machine can build.
  ImageBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${SourceBucket.Arn}/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt DeciderRepo.Arn
    Condition: DeployDecider

  ImageBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ch10-decider-build
      ServiceRole: !GetAtt ImageBuildRole.Arn
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/src.zip
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM

        # x86_64, because every GPU family AgentCore supports is x86_64.
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPO
            Value: !GetAtt DeciderRepo.RepositoryUri
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
    Condition: DeployDecider

  # AgentCore assumes this to launch and tear down EC2 in the account.
  CapacityOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/BedrockAgentCoreRuntimeInstancesOperatorRolePolicy
    Condition: DeployDecider

  # Attached to the instance itself, for AgentCore to collect its system logs.
  DeciderInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    Condition: DeployDecider

  DeciderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DeciderInstanceRole
    Condition: DeployDecider

  # What the agent process itself may do: pull its image and read the bucket.
  DeciderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt DeciderRepo.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${BatchBucket.Arn}/*
    Condition: DeployDecider

  # Names take underscores, not hyphens: a hyphen fails validation.
  DeciderCapacity:
    Type: AWS::BedrockAgentCore::CapacityProvider
    Properties:
      Name: ch10_decider_capacity
      Description: GPU instances for the decision-model router
      PermissionsConfiguration:
        CapacityProviderOperatorRoleArn: !GetAtt CapacityOperatorRole.Arn
      ComputeConfiguration:
        Ec2Configuration:
          LaunchTemplateSource:
            LaunchParameters:
              OperatingSystem: LINUX_X86_64
              InstanceRequirements:
                AllowedInstanceTypes: !Ref DeciderInstanceTypes
              InstanceProfileArn: !GetAtt DeciderInstanceProfile.Arn
          VpcConfiguration:
            Subnets:
              - !Ref DeciderSubnetA
              - !Ref DeciderSubnetB
            SecurityGroups:
              - !Ref DeciderSecurityGroup

          # The weights and the CUDA torch install land here, not in the image,
          # and survive a session stop so only the first call pays for them.
          Volumes:
            - EbsConfiguration:
                Name: models
                SizeGiB: 60
                VolumeType: gp3
                Encrypted: true
                Throughput: 500
          RootVolume:
            FreeSpaceGiB: 30
            VolumeType: gp3
          LifecycleConfiguration:
            IdleInstanceTimeout: 600
            MaxLifetime: 86400
    Condition: DeployDecider

  DeciderRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: ch10_decider
      Description: Routes a conversation to a team with a decision model
      RoleArn: !GetAtt DeciderExecutionRole.Arn
      ProtocolConfiguration: HTTP
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref DeciderImageUri
      CapacityProviderConfiguration:
        CapacityProviderArn: !GetAtt DeciderCapacity.Arn
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets:
            - !Ref DeciderSubnetA
            - !Ref DeciderSubnetB
          SecurityGroups:
            - !Ref DeciderSecurityGroup
      EnvironmentVariables:
        DECIDER_MODEL: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
        HF_HOME: /mnt/models/hf
        MODEL_VOLUME: /mnt/models
    Condition: DeciderReady

Outputs:
  BatchBucket:
    Value: !Ref BatchBucket

  BatchServiceRoleArn:
    Value: !GetAtt BatchServiceRole.Arn

  DeciderRuntimeArn:
    Description: Pass as AGENT_RUNTIME_ARN to src/decide.py
    Value: !GetAtt DeciderRuntime.AgentRuntimeArn
    Condition: DeciderReady

  DeciderRepoUri:
    Value: !GetAtt DeciderRepo.RepositoryUri
    Condition: DeployDecider

  DeciderSourceBucket:
    Value: !Ref SourceBucket
    Condition: DeployDecider
