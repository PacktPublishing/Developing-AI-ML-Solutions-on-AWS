name: ch10-batch

services:
  s3proxy:
    # Local S3 for the batch manifests and outputs: the batch shim reads the JSONL
    # shards and writes the .jsonl.out here, exactly as Bedrock batch uses real S3.
    # Pinned: an unpinned tag moves under the reader, and 4.1.x dropped the
    # shell tools an image-side probe used to rely on.
    image: andrewgaul/s3proxy:4.1.1
    environment:
      - S3PROXY_ENDPOINT=http://0.0.0.0:9000
      - S3PROXY_AUTHORIZATION=aws-v2-or-v4
      - S3PROXY_IDENTITY=local
      - S3PROXY_CREDENTIAL=localsecret
      - JCLOUDS_PROVIDER=filesystem
      - JCLOUDS_FILESYSTEM_BASEDIR=/data
    ports:
      - "9000:9000"
    healthcheck:
      # The image carries the server and a JRE, no curl and no wget, so readiness
      # is a TCP connect from bash: the port accepts once Jetty is listening.
      # CMD-SHELL would run this under dash, which has no /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 3s
      retries: 20
