# The LLM round on AWS: an Amazon Bedrock batch inference job. Every conversation
# is one line of a JSONL manifest in S3, Bedrock replays each modelInput against
# the batch model and writes the answers back as .jsonl.out, and route.py reads
# the collected predictions and publishes each conversation to its team's topic.
# One bucket holds both sides, under a prefix per run, so two runs at once cannot
# overwrite each other's manifests.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Client, AWSCloud]

    Client:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "classify.py\nroute.py"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: vertical
      Children: [JobRow, SNS]

    JobRow:
      Type: AWS::Diagram::HorizontalStack
      Children: [Bucket, Bedrock]

    Bucket:
      Type: AWS::S3::Bucket
      Title: "S3\ninput/<run>/ and output/<run>/"

    Bedrock:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Bedrock"
      Title: "Bedrock batch\nCreateModelInvocationJob\n(Nova Lite by default)"

    SNS:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Simple Notification Service (Amazon SNS)"
      Title: "SNS\nten team topics"

  Links:
    - {Source: Client, SourcePosition: E, Target: Bucket, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Bucket, SourcePosition: E, Target: Bedrock, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Client, SourcePosition: E, Target: SNS, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
