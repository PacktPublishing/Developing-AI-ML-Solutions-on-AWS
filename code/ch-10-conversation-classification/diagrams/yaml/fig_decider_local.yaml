# Local inference and the separate container startup check. make sm-local
# submits one example and deletes the endpoint; it does not write the dataset
# predictions consumed by route.py. Its CPU image uses the deployment Dockerfile
# with a different base image and PyTorch build.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Client, Local]

    Client:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "decide.py\nserve_local.py\nroute.py"

    Local:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: vertical
      Title: "Local development"
      Children: [Decider, LocalEndpoint, SNS]

    Decider:
      Type: AWS::Diagram::Resource
      Preset: "Strands"
      Title: "Strands Decider 2B\nin process (make decide)"

    LocalEndpoint:
      Type: AWS::Diagram::Resource
      Preset: "Docker"
      Title: "SageMaker local mode\nCPU container check (make sm-local)"

    SNS:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Simple Notification Service (Amazon SNS)"
      Title: "SNS shim\nten team inboxes"

  Links:
    - {Source: Client, SourcePosition: E, Target: Decider, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    # route.py publishes, not the model: it reads the predictions file back.
    - {Source: Client, SourcePosition: E, Target: LocalEndpoint, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Client, SourcePosition: E, Target: SNS, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
