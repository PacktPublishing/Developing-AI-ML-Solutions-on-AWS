AWSTemplateFormatVersion: "2010-09-09"

Description: |
  The underwriting knowledge base on Amazon OpenSearch Service, plus the
  underwriter app in front of it. A single-node domain with the k-NN plugin holds
  the embedded memos; OpenSearch Dashboards is the analyst UI. The app is one
  FastAPI image (ask/recommend UI + /ask and /cases) running in a container Lambda
  via the Lambda Web Adapter, behind API Gateway. Fine-grained access control
  gates the domain with a master user, so the endpoint is public but every request
  authenticates. Delete the stack when the round is done.

Parameters:
  MasterUserName:
    Description: Fine-grained-access-control master user for Dashboards and indexing
    Type: String
    Default: kbadmin

  EngineVersion:

    # 2.13+ enables the RAG (conversational search) pipeline feature by default;
    # 2.11 leaves it off and OpenSearch Service will not let you set the flag.
    Type: String
    Default: OpenSearch_2.17

  ImageUri:
    Description: ECR URI of the app image (built by the app-build stack)
    Type: String

Transform: AWS::Serverless-2016-10-31

Resources:
  Kb:

    # Keep the domain and its data on stack delete; the round is ephemeral.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: ch09-kb
      EngineVersion: !Ref EngineVersion

      # Smallest single node that carries the demo corpus; no dedicated master,
      # no zone awareness. gp3 with the default 10 GiB is ample for 500 memos.
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: 10

      # Fine-grained access control requires all three of the following.
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Ref MasterUserName
          MasterUserPassword: '{{resolve:secretsmanager:ch09-os-master}}'

      # The endpoint is public so the Lambda can reach it; fine-grained access
      # control then authenticates every request against the master user. In
      # production, restrict Dashboards to an IP range and give the app its own
      # IAM-signed identity (the chapter's hardened posture).
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action: es:ESHttp*
            Resource: !Sub arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ch09-kb/*

  # ---------------------------------------------------------------------------
  # the RAG connector role: OpenSearch ml-commons assumes this to call Bedrock,
  # so Dashboards conversational search can generate grounded answers in place.
  # ---------------------------------------------------------------------------
  RagRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ch09-rag-connector
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: opensearchservice.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ch09-kb
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/anthropic.*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

  # ---------------------------------------------------------------------------
  # the underwriter app: one FastAPI image, container Lambda via the Web Adapter
  # ---------------------------------------------------------------------------
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bedrock
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/amazon.*
                  - !Sub arn:aws:bedrock:*::foundation-model/anthropic.*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Sid: ModelSubscription
                Effect: Allow
                Action: aws-marketplace:ViewSubscriptions
                Resource: '*'

  App:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Role: !GetAtt AppRole.Arn
      MemorySize: 1024
      Timeout: 30 # API Gateway HTTP API caps the integration at 30s
      Environment:
        Variables:
          STORE: opensearch
          OPENSEARCH_HOST: !GetAtt Kb.DomainEndpoint
          OPENSEARCH_PORT: "443"
          OPENSEARCH_SSL: "1"
          OPENSEARCH_USER: !Ref MasterUserName
          OPENSEARCH_PASSWORD: '{{resolve:secretsmanager:ch09-os-master}}'
          BEDROCK_REGION: !Ref AWS::Region

          # Generate with Claude on Bedrock (the account's enabled text model);
          # embeddings stay on Titan v2. The AppRole allows anthropic.* profiles.
          TEXT_MODEL: global.anthropic.claude-haiku-4-5-20251001-v1:0
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # The role the domain assumes to call Bedrock for the neural plugin. The model
  # runs in Bedrock rather than inside the cluster, which is what makes this
  # workable on a t3.small node: the connector is a reference, not a hosted model.
  BedrockConnectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ch09-opensearch-bedrock
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: opensearchservice.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-embeddings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0

  # ---------------------------------------------------------------------------
  # the neural plugin, as infrastructure. AWS ships a console integration that
  # does this, but it is launched by hand and still leaves you to map the role in
  # Dashboards, so the whole setup lives here instead: one custom resource that
  # maps the role, creates the connector, registers the model, and builds the
  # ingest pipeline. Its outputs are the ids an index needs.
  # ---------------------------------------------------------------------------
  NeuralProviderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: configure-neural-search
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: es:ESHttp*
                Resource: !Sub arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ch09-kb/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ch09-os-master*

              # the connector carries a roleArn, and passing it is what needs this
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt BedrockConnectorRole.Arn

  NeuralProvider:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt NeuralProviderRole.Arn
      Code:

        # Inline so cfnresponse comes from the runtime. No requests: urllib and
        # botocore's signer are both already present.
        ZipFile: |
          import base64
          import json
          import urllib.request

          import boto3
          import cfnresponse
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest

          CONNECTOR = "bedrock-titan-embeddings"
          MODEL = "bedrock-titan-embed"


          def _call(url, method, body, headers):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in headers.items():
                  req.add_header(key, value)
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read().decode()
              return json.loads(raw) if raw else {}


          def basic(url, method, body, user, password):
              """Call the domain as the master user, which owns security config."""
              token = base64.b64encode(f"{user}:{password}".encode()).decode()
              return _call(url, method, body, {
                  "Content-Type": "application/json",
                  "Authorization": f"Basic {token}",
              })


          def signed(url, method, body, region):
              """Call the domain as this Lambda's IAM role, which is what PassRole sees."""
              data = json.dumps(body) if body is not None else None
              aws = AWSRequest(method=method, url=url, data=data,
                               headers={"Content-Type": "application/json"})
              creds = boto3.Session().get_credentials().get_frozen_credentials()
              SigV4Auth(creds, "es", region).add_auth(aws)
              return _call(url, method, body, dict(aws.headers))


          def wait(host, task_id, region):
              """Poll one ml-commons task to completion."""
              import time
              for _ in range(120):
                  task = signed(f"{host}/_plugins/_ml/tasks/{task_id}", "GET", None, region)
                  if task.get("state") == "COMPLETED":
                      return task
                  if task.get("state") == "FAILED":
                      raise RuntimeError(f"ml task failed: {task.get('error')}")
                  time.sleep(5)
              raise RuntimeError("ml task did not finish")


          def handler(event, context):
              props = event["ResourceProperties"]
              host = "https://" + props["DomainEndpoint"]
              region = props["Region"]
              try:
                  if event["RequestType"] == "Delete":
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, CONNECTOR)
                      return

                  secret = boto3.client("secretsmanager").get_secret_value(
                      SecretId=props["MasterSecret"])["SecretString"]
                  user = props["MasterUser"]
                  role_arn = boto3.client("sts").get_caller_identity()["Arn"]
                  role_arn = role_arn.replace(":sts:", ":iam:").replace(
                      ":assumed-role/", ":role/").rsplit("/", 1)[0]

                  # PUT, not PATCH: a PATCH here returns 200 and changes nothing
                  basic(f"{host}/_plugins/_security/api/rolesmapping/ml_full_access",
                        "PUT", {"backend_roles": [role_arn]}, user, secret)

                  basic(f"{host}/_cluster/settings", "PUT", {"persistent": {
                      "plugins.ml_commons.only_run_on_ml_node": False,
                      "plugins.ml_commons.model_access_control_enabled": False,
                      "plugins.ml_commons.trusted_connector_endpoints_regex": [
                          "^https://bedrock-runtime\\..*[a-z0-9-]\\.amazonaws\\.com/.*$"],
                  }}, user, secret)

                  model_id = props["EmbedModel"]
                  created = signed(f"{host}/_plugins/_ml/connectors/_create", "POST", {
                      "name": CONNECTOR,
                      "description": "Titan text embeddings for the memo index",
                      "version": 1,
                      "protocol": "aws_sigv4",
                      "credential": {"roleArn": props["ConnectorRoleArn"]},
                      "parameters": {
                          "region": region,
                          "service_name": "bedrock",
                          "dimensions": int(props["Dimension"]),
                          "normalize": True,
                      },
                      "actions": [{
                          "action_type": "predict",
                          "method": "POST",
                          "url": f"https://bedrock-runtime.{region}.amazonaws.com/model/{model_id}/invoke",
                          "headers": {"content-type": "application/json"},
                          # the pre-process function fills inputText; naming it
                          # anything else fails at ingest, not here
                          "request_body": '{"inputText": "${parameters.inputText}", "dimensions": ${parameters.dimensions}, "normalize": ${parameters.normalize}}',
                          "pre_process_function": "connector.pre_process.bedrock.embedding",
                          "post_process_function": "connector.post_process.bedrock.embedding",
                      }],
                  }, region)
                  connector_id = created["connector_id"]

                  registered = signed(f"{host}/_plugins/_ml/models/_register", "POST", {
                      "name": MODEL,
                      "function_name": "remote",
                      "description": "Titan embeddings through the connector",
                      "connector_id": connector_id,
                  }, region)
                  ml_model = wait(host, registered["task_id"], region)["model_id"]

                  deployed = signed(
                      f"{host}/_plugins/_ml/models/{ml_model}/_deploy", "POST", None, region)
                  wait(host, deployed["task_id"], region)

                  basic(f"{host}/_ingest/pipeline/memo-embed", "PUT", {
                      "description": "embed memo chunks through Bedrock on the way in",
                      "processors": [{"text_embedding": {
                          "model_id": ml_model,
                          "field_map": {"content": "embedding"}}}],
                  }, user, secret)

                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   {"ModelId": ml_model, "ConnectorId": connector_id},
                                   connector_id)
              except Exception as exc:  # surface the reason in the stack event
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                   {"Error": str(exc)[:900]}, CONNECTOR)

  NeuralModel:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt NeuralProvider.Arn
      DomainEndpoint: !GetAtt Kb.DomainEndpoint
      Region: !Ref AWS::Region
      MasterUser: !Ref MasterUserName
      MasterSecret: ch09-os-master
      ConnectorRoleArn: !GetAtt BedrockConnectorRole.Arn
      EmbedModel: amazon.titan-embed-text-v2:0
      Dimension: 1024

Outputs:
  DomainEndpoint:
    Value: !GetAtt Kb.DomainEndpoint

  DashboardsURL:
    Description: Open this, sign in with the master user, and search the memo index
    Value: !Sub https://${Kb.DomainEndpoint}/_dashboards/

  AppUrl:
    Description: The underwriter app (ask/cases) behind API Gateway
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com

  RagRoleArn:
    Description: Role ml-commons assumes to call Bedrock for Dashboards RAG
    Value: !GetAtt RagRole.Arn

  MasterUserName:
    Value: !Ref MasterUserName

  BedrockConnectorRoleArn:
    Description: role the domain assumes to call Bedrock (neural plugin)
    Value: !GetAtt BedrockConnectorRole.Arn

  NeuralModelId:
    Description: ml-commons model id for the neural query
    Value: !GetAtt NeuralModel.ModelId
