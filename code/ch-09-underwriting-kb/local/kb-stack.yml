name: ch09-kb

services:
  vectors:
    # Postgres with pgvector: the local vector store for the memo knowledge base.
    # On AWS this is Amazon Aurora PostgreSQL with the same extension; the
    # retrieval SQL does not change.
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=underwriter
      - POSTGRES_PASSWORD=underwriter
      - POSTGRES_DB=underwriting
    ports:
      - "5545:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwriter -d underwriting"]
      interval: 5s
      timeout: 3s
      retries: 20

  search:
    # OpenSearch with the k-NN plugin: the second local vector store. On AWS this
    # is Amazon OpenSearch Service with the same knn_vector mapping. Security is
    # off for the local single node, so the client talks plain HTTP on 9200.
    # Started only when asked: `make up STORE=opensearch`.
    profiles: ["opensearch"]
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
