name: ch09-kb

services:
  search:
    # OpenSearch with the k-NN plugin: the local vector store. On AWS this
    # is Amazon OpenSearch Service with the same knn_vector mapping. Security is
    # off for the local single node, so the client talks plain HTTP on 9200.
    # Started only when asked: `make up STORE=opensearch`.
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  dashboards:
    # OpenSearch Dashboards: the local search UI, the same one Amazon OpenSearch
    # Service hosts on the domain. Security is off to match the local engine, so
    # it connects over plain HTTP. Open http://localhost:5601 once it is up.
    image: opensearchproject/opensearch-dashboards:2.17.1
    environment:
      - 'OPENSEARCH_HOSTS=["http://search:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      search:
        condition: service_healthy
