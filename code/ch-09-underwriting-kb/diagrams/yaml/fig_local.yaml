# The local half of the pair: the same shape as fig_aws with the local stand-ins
# swapped in. The FastAPI app embeds the question and the memos with Ollama instead
# of Bedrock and retrieves the nearest chunks from an OpenSearch container instead
# of a managed domain. Dashboards comes up on 5601 either way. /agent hands the
# question to the Strands agent, which searches the memos and runs the DTI
# arithmetic as tools rather than asking the model to do the sums.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Underwriter, Local]

    Underwriter:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "underwriter\nmake ask / cases"

    Local:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Title: "Local cloud (Docker Compose)"
      Children: [AppCol, AgentCol, Backends]

    AppCol:
      Type: AWS::Diagram::VerticalStack
      Children: [App]
    App:
      Type: AWS::Diagram::Resource
      Preset: "FastAPI"
      Title: "FastAPI app\nuvicorn"
    AgentCol:
      Type: AWS::Diagram::VerticalStack
      Children: [Agent]
    Agent:
      Type: AWS::Diagram::Resource
      Preset: "Strands"
      Title: "Strands agent"
    Backends:
      Type: AWS::Diagram::VerticalStack
      Children: [Ollama, Store]
    Ollama:
      Type: AWS::Diagram::Resource
      Preset: "Ollama"
      Title: "Ollama\nembed + generate"
    Store:
      Type: AWS::Diagram::Resource
      Preset: "OpenSearch"
      Title: "OpenSearch\ncontainer + Dashboards"

  Links:
    - {Source: Underwriter, SourcePosition: E, Target: App, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: App, SourcePosition: E, Target: Agent, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Agent, SourcePosition: E, Target: Ollama, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Agent, SourcePosition: E, Target: Store, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
