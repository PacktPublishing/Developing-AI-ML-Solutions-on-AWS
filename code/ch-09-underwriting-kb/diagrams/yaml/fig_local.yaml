# Local retrieval: the FastAPI ask/recommend app embeds the question and the memos
# with Ollama (the local Bedrock stand-in), retrieves the nearest chunks from the
# vector store, and grounds the answer in them with citations. OpenSearch mirrors
# the AWS domain; STORE=pgvector | s3vectors swaps it, the retrieval code unchanged.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Underwriter, Local]

    Underwriter:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "underwriter\nmake ask / cases"

    Local:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Title: "Local cloud (Docker Compose)"
      Children: [App, Backends]

    App:
      Type: AWS::Diagram::Resource
      Preset: "FastAPI"
      Title: "FastAPI app\nask / recommend (uvicorn)"
    Backends:
      Type: AWS::Diagram::VerticalStack
      Children: [Ollama, Store]
    Ollama:
      Type: AWS::Diagram::Resource
      Preset: "Ollama"
      Title: "Ollama\nembed + generate"
    Store:
      Type: AWS::Diagram::Resource
      Preset: "OpenSearch"
      Title: "OpenSearch\n(pgvector | S3 Vectors)"

  Links:
    - {Source: Underwriter, SourcePosition: E, Target: App, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: App, SourcePosition: E, Target: Ollama, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: App, SourcePosition: E, Target: Store, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
