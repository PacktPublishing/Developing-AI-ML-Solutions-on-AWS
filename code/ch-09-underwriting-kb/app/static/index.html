<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Underwriting knowledge base</title>
    <style>
      :root { --ink: #16191f; --muted: #6b7280; --line: #e5e7eb; --accent: #146c43; --bg: #f7f8fa; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.55 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
      header { background: #16191f; color: #fff; padding: 18px 24px; }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; }
      header p { margin: 4px 0 0; color: #9aa4b2; font-size: 13px; }
      main { max-width: 860px; margin: 24px auto; padding: 0 20px; }
      .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
      .tab { padding: 8px 16px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-weight: 500; }
      .tab[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      textarea { width: 100%; min-height: 82px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; resize: vertical; }
      button.go { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
      button.go:disabled { opacity: .55; cursor: default; }
      .answer { margin-top: 18px; white-space: pre-wrap; }
      .answer.empty { color: var(--muted); }
      .sources { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .sources .lbl { color: var(--muted); font-size: 13px; }
      .badge { font-size: 12px; background: #eef6f0; color: var(--accent); border: 1px solid #cfe6d8; border-radius: 999px; padding: 3px 10px; }
      .spin { color: var(--muted); margin-top: 16px; }
      footer { text-align: center; color: var(--muted); font-size: 12px; margin: 28px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Underwriting knowledge base</h1>
      <p>Ask about past underwriting, or assess a new deal against similar prior cases. Every answer cites its source loans.</p>
    </header>
    <main>
      <div class="tabs" role="tablist">
        <div class="tab" role="tab" data-mode="ask" aria-selected="true">Ask a question</div>
        <div class="tab" role="tab" data-mode="cases" aria-selected="false">Assess a new deal</div>
      </div>
      <div class="card">
        <label id="lbl" for="q">Your question</label>
        <textarea id="q" placeholder="How is DTI assessed for a grocery business?"></textarea>
        <button class="go" id="go">Ask</button>
        <div id="out"></div>
      </div>
      <footer>Grounded retrieval over the memo knowledge base. Not a lending decision.</footer>
    </main>
    <script>
      let mode = "ask";
      const q = document.getElementById("q");
      const out = document.getElementById("out");
      const go = document.getElementById("go");
      const lbl = document.getElementById("lbl");
      const copy = {
        ask: { label: "Your question", ph: "How is DTI assessed for a grocery business?", btn: "Ask", key: "query" },
        cases: { label: "The new deal", ph: "A logistics firm seeks a $500,000 working-capital loan for six months.", btn: "Assess", key: "deal" },
      };
      document.querySelectorAll(".tab").forEach((t) =>
        t.addEventListener("click", () => {
          mode = t.dataset.mode;
          document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === t));
          lbl.textContent = copy[mode].label;
          q.placeholder = copy[mode].ph;
          go.textContent = copy[mode].btn;
          out.innerHTML = "";
        }),
      );
      async function run() {
        const text = q.value.trim();
        if (!text) return;
        go.disabled = true;
        out.innerHTML = '<div class="spin">Searching the knowledge base and drafting an answer…</div>';
        try {
          const body = { [copy[mode].key]: text };
          const r = await fetch("/" + mode, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          const data = await r.json();
          const src = (data.sources || [])
            .map((s) => `<span class="badge">${s.loan_id} · ${s.borrower}</span>`)
            .join("");
          out.innerHTML =
            `<div class="answer">${escapeHtml(data.answer || "")}</div>` +
            (src ? `<div class="sources"><span class="lbl">Sources</span>${src}</div>` : "");
        } catch (e) {
          out.innerHTML = '<div class="answer empty">Something went wrong. Is the store seeded?</div>';
        } finally {
          go.disabled = false;
        }
      }
      function escapeHtml(s) {
        return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      }
      go.addEventListener("click", run);
    </script>
  </body>
</html>
