<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Underwriting knowledge base</title>
    <style>
      :root { --ink: #16191f; --muted: #6b7280; --line: #e5e7eb; --accent: #146c43; --bg: #f7f8fa; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.55 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
      header { background: #16191f; color: #fff; padding: 18px 24px; }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; }
      header p { margin: 4px 0 0; color: #9aa4b2; font-size: 13px; }
      main { max-width: 860px; margin: 24px auto; padding: 0 20px; }
      .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
      .tab { padding: 8px 16px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-weight: 500; }
      .tab[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      textarea { width: 100%; min-height: 82px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; resize: vertical; }
      button.go { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
      button.go:disabled { opacity: .55; cursor: default; }
      .answer { margin-top: 18px; white-space: pre-wrap; }
      .answer.empty { color: var(--muted); }
      .sources { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .sources .lbl { color: var(--muted); font-size: 13px; }
      .badge { font-size: 12px; background: #eef6f0; color: var(--accent); border: 1px solid #cfe6d8; border-radius: 999px; padding: 3px 10px; }
      .spin { color: var(--muted); margin-top: 16px; }
      footer { text-align: center; color: var(--muted); font-size: 12px; margin: 28px 0; }
      .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
      .filters label { font-weight: 500; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
      input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
      #signin { max-width: 360px; margin: 40px auto; }
      #signin input { margin-bottom: 10px; }
      .who { float: right; color: #9aa4b2; font-size: 13px; cursor: pointer; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <span class="who" id="who" hidden></span>
      <h1>Underwriting knowledge base</h1>
      <p>Ask about past underwriting, or assess a new deal against similar prior cases. Every answer cites its source loans.</p>
    </header>
    <main>
      <div class="card" id="signin" hidden>
        <label for="user">Underwriter</label>
        <input id="user" autocomplete="username" />
        <label for="pass">Password</label>
        <input id="pass" type="password" autocomplete="current-password" />
        <button class="go" id="login">Sign in</button>
        <div id="loginmsg" class="answer empty"></div>
      </div>
      <div id="app" hidden>
      <div class="tabs" role="tablist">
        <div class="tab" role="tab" data-mode="ask" aria-selected="true">Ask a question</div>
        <div class="tab" role="tab" data-mode="cases" aria-selected="false">Assess a new deal</div>
      </div>
      <div class="card">
        <label id="lbl" for="q">Your question</label>
        <textarea id="q" placeholder="How is DTI assessed for a grocery business?"></textarea>
        <div class="filters">
          <div>
            <label for="sector">Sector</label>
            <select id="sector">
              <option value="">Any sector</option>
              <option>Grocery &amp; Provisions</option><option>Logistics</option><option>Pharmacy</option>
              <option>Building Materials</option><option>Textiles</option><option>Agro Supplies</option>
              <option>Restaurant Supply</option><option>Auto Parts</option>
            </select>
          </div>
          <div><label for="maxexp">Max exposure (USD)</label><input id="maxexp" type="number" min="0" step="100000" /></div>
          <div><label for="since">Decided since</label><input id="since" type="date" /></div>
        </div>
        <button class="go" id="go">Ask</button>
        <div id="out"></div>
      </div>
      </div>
      <footer>Grounded retrieval over past memos and credit policy. Not a lending decision.</footer>
    </main>
    <script>
      let mode = "ask";
      const q = document.getElementById("q");
      const out = document.getElementById("out");
      const go = document.getElementById("go");
      const lbl = document.getElementById("lbl");
      const copy = {
        ask: { label: "Your question", ph: "How is DTI assessed for a grocery business?", btn: "Ask", key: "query" },
        cases: { label: "The new deal", ph: "A logistics firm seeks a $500,000 working-capital loan for six months.", btn: "Assess", key: "deal" },
      };
      document.querySelectorAll(".tab").forEach((t) =>
        t.addEventListener("click", () => {
          mode = t.dataset.mode;
          document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === t));
          lbl.textContent = copy[mode].label;
          q.placeholder = copy[mode].ph;
          go.textContent = copy[mode].btn;
          out.innerHTML = "";
        }),
      );
      // Sign-in: the API only answers with a token from the underwriters' Cognito
      // user pool; /auth-config says where it is (cognito-shim locally, AWS in the cloud).
      let auth = {};
      let token = sessionStorage.getItem("idToken") || "";
      function show(signedIn) {
        document.getElementById("signin").hidden = signedIn;
        document.getElementById("app").hidden = !signedIn;
        const who = document.getElementById("who");
        who.hidden = !(signedIn && auth.client_id);
        if (token) who.textContent = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")))["cognito:username"] + " · sign out";
      }
      async function signIn() {
        const msg = document.getElementById("loginmsg");
        msg.textContent = "";
        const r = await fetch(auth.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth" },
          body: JSON.stringify({
            AuthFlow: "USER_PASSWORD_AUTH",
            ClientId: auth.client_id,
            AuthParameters: { USERNAME: document.getElementById("user").value, PASSWORD: document.getElementById("pass").value },
          }),
        });
        const data = await r.json();
        if (!data.AuthenticationResult) { msg.textContent = data.message || "Sign-in failed."; return; }
        token = data.AuthenticationResult.IdToken;
        sessionStorage.setItem("idToken", token);
        show(true);
      }
      function signOut() { token = ""; sessionStorage.removeItem("idToken"); show(false); }
      document.getElementById("login").addEventListener("click", signIn);
      document.getElementById("who").addEventListener("click", signOut);
      fetch("/auth-config").then((r) => r.json()).then((cfg) => { auth = cfg; show(!auth.client_id || !!token); });

      async function run() {
        const text = q.value.trim();
        if (!text) return;
        go.disabled = true;
        out.innerHTML = '<div class="spin">Searching the knowledge base and drafting an answer…</div>';
        try {
          const body = { [copy[mode].key]: text };
          const sector = document.getElementById("sector").value;
          const maxexp = document.getElementById("maxexp").value;
          const since = document.getElementById("since").value;
          if (sector) body.sector = sector;
          if (maxexp) body.max_exposure = Number(maxexp);
          if (since) body.since = since;
          const headers = { "Content-Type": "application/json" };
          if (token) headers.Authorization = "Bearer " + token;
          const r = await fetch("/" + mode, { method: "POST", headers, body: JSON.stringify(body) });
          if (r.status === 401) { signOut(); return; }
          const data = await r.json();
          const src = (data.sources || [])
            .map((s) => `<span class="badge">${s.loan_id ? s.loan_id + " · " + s.borrower : s.borrower}</span>`)
            .join("");
          out.innerHTML =
            `<div class="answer">${escapeHtml(data.answer || "")}</div>` +
            (src ? `<div class="sources"><span class="lbl">Sources</span>${src}</div>` : "");
        } catch (e) {
          out.innerHTML = '<div class="answer empty">Something went wrong. Is the store seeded?</div>';
        } finally {
          go.disabled = false;
        }
      }
      function escapeHtml(s) {
        return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      }
      go.addEventListener("click", run);
    </script>
  </body>
</html>
