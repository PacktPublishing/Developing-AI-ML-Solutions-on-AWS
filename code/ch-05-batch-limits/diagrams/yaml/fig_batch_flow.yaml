# The monthly batch run as a four-step flow: shortlist -> score -> decide -> apply, each step
# handing the next a CSV artifact in S3, with the Redshift warehouse at both ends.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Run]

    Run:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: vertical
      Children: [Store, Steps]

    # The three artifacts the steps hand each other, all in one bucket prefix.
    Store:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Simple Storage Service (Amazon S3)"
      Direction: horizontal
      Title: "S3 batch bucket"
      Children: [Eligible, Scores, Decisions]
    Eligible:
      Type: AWS::Diagram::Resource
      Preset: "Data table"
      Title: "eligible.csv"
    Scores:
      Type: AWS::Diagram::Resource
      Preset: "Data table"
      Title: "scores.csv"
    Decisions:
      Type: AWS::Diagram::Resource
      Preset: "Data table"
      Title: "decisions.csv"

    # The four steps, with the warehouse read at the start and the write-back at the end.
    Steps:
      Type: AWS::Diagram::HorizontalStack
      Children: [WarehouseIn, Shortlist, Score, Decide, Apply, WarehouseOut]
    WarehouseIn:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Redshift"
      Title: "Redshift\ncustomers"
    Shortlist:
      Type: AWS::Diagram::Resource
      Preset: "Gear"
      Title: "shortlist"
    Score:
      Type: AWS::Diagram::Resource
      Preset: "Gear"
      Title: "score"
    Decide:
      Type: AWS::Diagram::Resource
      Preset: "Gear"
      Title: "decide"
    Apply:
      Type: AWS::Diagram::Resource
      Preset: "Gear"
      Title: "apply"
    WarehouseOut:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Redshift"
      Title: "Redshift\nnew limits"

  Links:
    - {Source: WarehouseIn, SourcePosition: E, Target: Shortlist, TargetPosition: W, TargetArrowHead: {Type: Open}}
    - {Source: Shortlist, SourcePosition: N, Target: Eligible, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Eligible, SourcePosition: E, Target: Score, TargetPosition: N, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Score, SourcePosition: N, Target: Scores, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Scores, SourcePosition: E, Target: Decide, TargetPosition: N, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Decide, SourcePosition: N, Target: Decisions, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Decisions, SourcePosition: E, Target: Apply, TargetPosition: N, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Apply, SourcePosition: E, Target: WarehouseOut, TargetPosition: W, TargetArrowHead: {Type: Open}}
