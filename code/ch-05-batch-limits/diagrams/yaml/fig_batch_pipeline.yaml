# The monthly batch limit run: an EventBridge schedule starts the SageMaker pipeline, which reads the warehouse, scores limits in the step container, and stages results in S3; failures fan out to SNS.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [AWSCloud]

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Children: [Trigger, Pipeline, Data]

    Trigger:
      Type: AWS::Diagram::VerticalStack
      Children: [Schedule, Developer, Git, CodeBuild, ECR]
    Schedule:
      Type: AWS::Diagram::Resource
      Preset: "Amazon EventBridge"
      Title: "EventBridge\nmonthly schedule"
    Developer:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "Developer"
    Git:
      Type: AWS::Diagram::Resource
      Preset: "Git repository"
      Title: "Git repo"
    CodeBuild:
      Type: AWS::Diagram::Resource
      Preset: "AWS CodeBuild"
      Title: "CodeBuild"
    ECR:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Elastic Container Registry (Amazon ECR)"
      Title: "ECR step image"

    Pipeline:
      Type: AWS::Diagram::Resource
      Preset: "Amazon SageMaker AI"
      Title: "SageMaker Pipeline"
      Direction: vertical
      Children: [StepShortlist, StepTrain, StepScore, StepDecide, StepApply]

    StepShortlist:
      Type: AWS::Diagram::Resource
      Preset: "Amazon SageMaker AI"
      Title: "shortlist (Processing)"
    StepTrain:
      Type: AWS::Diagram::Resource
      Preset: "Amazon SageMaker AI"
      Title: "train (Training)"
    StepScore:
      Type: AWS::Diagram::Resource
      Preset: "Amazon SageMaker AI"
      Title: "score (Processing)"
    StepDecide:
      Type: AWS::Diagram::Resource
      Preset: "AWS Lambda"
      Title: "decide (Lambda)"
    StepApply:
      Type: AWS::Diagram::Resource
      Preset: "AWS Lambda"
      Title: "apply-limits (Lambda)"

    Data:
      Type: AWS::Diagram::VerticalStack
      Children: [Redshift, Bucket, Sns, CloudWatch]
    Redshift:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Redshift"
      Title: "Redshift\nwarehouse"
    Bucket:
      Type: AWS::S3::Bucket
      Title: "S3\nbatch results"
    Sns:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Simple Notification Service (Amazon SNS)"
      Title: "SNS\nrun summary + failures"
    CloudWatch:
      Type: AWS::Diagram::Resource
      Preset: "Amazon CloudWatch"
      Title: "CloudWatch\nper-decision counts"

  Links:
    - {Source: StepShortlist, SourcePosition: S, Target: StepTrain, TargetPosition: N, TargetArrowHead: {Type: Open}}
    - {Source: StepTrain, SourcePosition: S, Target: StepScore, TargetPosition: N, TargetArrowHead: {Type: Open}}
    - {Source: StepScore, SourcePosition: S, Target: StepDecide, TargetPosition: N, TargetArrowHead: {Type: Open}}
    - {Source: StepDecide, SourcePosition: S, Target: StepApply, TargetPosition: N, TargetArrowHead: {Type: Open}}
    - {Source: Schedule, SourcePosition: E, Target: Pipeline, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Developer, SourcePosition: S, Target: Git, TargetPosition: N, TargetArrowHead: {Type: Open}}
    - {Source: Git, SourcePosition: S, Target: CodeBuild, TargetPosition: N, TargetArrowHead: {Type: Open}}
    - {Source: CodeBuild, SourcePosition: S, Target: ECR, TargetPosition: N, TargetArrowHead: {Type: Open}}
    - {Source: ECR, SourcePosition: E, Target: Pipeline, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Pipeline, SourcePosition: E, Target: Redshift, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Pipeline, SourcePosition: E, Target: Bucket, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Pipeline, SourcePosition: E, Target: Sns, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: Pipeline, SourcePosition: E, Target: CloudWatch, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
