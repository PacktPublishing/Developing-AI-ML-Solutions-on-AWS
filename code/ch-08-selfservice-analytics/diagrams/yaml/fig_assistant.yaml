Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children:
        - Analyst
        - AWSCloud

    Analyst:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "browser terminal"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Children:
        - AgentCol
        - BackendCol
        - WarehouseCol

    # single child: the task centres on the canvas axis, so the analyst's link
    # lands on the icon instead of striking through the caption below it.
    AgentCol:
      Type: AWS::Diagram::VerticalStack
      Children:
        - Task

    Task:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "ECS Fargate task\nagent + read-only role"

    BackendCol:
      Type: AWS::Diagram::VerticalStack
      Children:
        - Bedrock
        - Helper

    # own column: a link dropped from the helper's S would run straight through
    # the caption underneath it.
    WarehouseCol:
      Type: AWS::Diagram::VerticalStack
      Children:
        - Warehouse

    Bedrock:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Bedrock"
      Title: "Bedrock\nClaude (InvokeModel)"

    Helper:
      Type: AWS::Diagram::Resource
      Preset: Claude
      Title: "Data API helper\ntimeout, row cap, masking"

    Warehouse:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Redshift"
      Title: "Redshift Serverless\nData API, read-only"

  Links:
    - Source: Analyst
      SourcePosition: E
      Target: Task
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: Task
      SourcePosition: E
      Target: Bedrock
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: Task
      SourcePosition: E
      Target: Helper
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
    - Source: Helper
      SourcePosition: E
      Target: Warehouse
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Type: orthogonal
