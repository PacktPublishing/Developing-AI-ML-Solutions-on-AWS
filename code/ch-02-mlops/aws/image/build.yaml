AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Image-build infrastructure for the MLOps chapter: an ECR repository and a
  CodeBuild project that builds a custom training/serving container natively on
  amd64 (the architecture SageMaker training and endpoints run) and pushes it to
  ECR. Deploy once per image (RepoName=ch02-challenger or ch02-scorecard), upload
  the build context, start the build. All resources are disposable.

Parameters:
  RepoName:
    Type: String
    Default: ch02-challenger
    AllowedValues:
      - ch02-challenger
      - ch02-scorecard
      - ch02-pipeline-step
      - ch02-lambda-registry

Resources:

  # Holds the zipped build context (Dockerfile + container code + buildspec.yml).
  SourceBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ImageRepo:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepoName
      EmptyOnDelete: true

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ImageRepo.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${SourceBucket.Arn}/*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${RepoName}-build"
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub "${SourceBucket}/src.zip"
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_LARGE
        PrivilegedMode: true    # required for docker build
        EnvironmentVariables:
          - {Name: ECR_REGISTRY, Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"}
          - {Name: IMAGE_URI, Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepoName}:latest"}

Outputs:
  SourceBucket:
    Value: !Ref SourceBucket
  BuildProject:
    Value: !Ref BuildProject
  ImageUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepoName}:latest"
