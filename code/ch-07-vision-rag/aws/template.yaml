AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Serverless vision RAG for KYC on AWS. Identity photos land in S3, an enrolment
  trigger hands them to an asynchronous SageMaker endpoint on a GPU instance, and the
  face vectors go into an express Aurora Serverless cluster with pgvector. The endpoint
  publishes each completion to SNS, a subscriber writes the outcome to DynamoDB, and
  the application polls that table rather than the results bucket.
  Aurora has no CloudFormation resource for the express configuration yet, so an inline
  boto3 custom resource creates the cluster. Nothing here needs a VPC.

Parameters:
  ClusterName:
    Description: the Aurora DB cluster identifier
    Type: String
    Default: ch07-kyc

  DBUser:
    Description: the cluster master user (express configuration defaults to postgres)
    Type: String
    Default: postgres

  DBName:
    Description: the database the face vectors live in (express default is postgres)
    Type: String
    Default: postgres

  EndpointName:
    Description: the asynchronous embedding endpoint the trigger calls.
    Type: String
    Default: ch07-kyc-face

Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    MemorySize: 256

Resources:

  # Aurora express configuration has no CloudFormation resource yet, but it is a
  # create_db_cluster parameter (WithExpressConfiguration), so an inline boto3 Lambda custom
  # resource creates the cluster and its serverless instance, not a shell-out to the CLI.
  AuroraProviderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: aurora-express
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:CreateDBCluster
                  - rds:CreateDBInstance
                  - rds:DeleteDBCluster
                  - rds:DeleteDBInstance
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                  - rds:EnableInternetAccessGateway
                  - ec2:DescribeAvailabilityZones
                Resource: '*'
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: rds.amazonaws.com

  AuroraProvider:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt AuroraProviderRole.Arn
      Code:

        # Inline (ZipFile) so cfnresponse is provided by the runtime; boto3 is already there.
        ZipFile: |
          import time
          import boto3
          import cfnresponse

          def handler(event, context):
              rds = boto3.client("rds")
              cid = event["ResourceProperties"]["DBClusterIdentifier"]
              deadline = time.time() + context.get_remaining_time_in_millis() / 1000 - 60
              try:
                  if event["RequestType"] == "Delete":
                      _delete(rds, cid, deadline)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, cid)
                      return
                  if event["RequestType"] == "Create":
                      # one call creates the cluster, a serverless instance, and the gateway
                      rds.create_db_cluster(
                          DBClusterIdentifier=cid,
                          Engine="aurora-postgresql",
                          WithExpressConfiguration=True,
                      )
                  while time.time() < deadline:
                      c = rds.describe_db_clusters(DBClusterIdentifier=cid)["DBClusters"][0]
                      if c["Status"] == "available" and c.get("Endpoint"):
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                              "Endpoint": c["Endpoint"],
                              "Port": str(c["Port"]),
                              "ClusterResourceId": c["DbClusterResourceId"],
                          }, cid)
                          return
                      time.sleep(15)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, cid)
              except Exception as exc:  # always signal, never hang the stack
                  print("error:", exc)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, cid)

          def _delete(rds, cid, deadline):
              try:
                  c = rds.describe_db_clusters(DBClusterIdentifier=cid)["DBClusters"][0]
              except rds.exceptions.DBClusterNotFoundFault:
                  return
              for m in c["DBClusterMembers"]:
                  try:
                      rds.delete_db_instance(
                          DBInstanceIdentifier=m["DBInstanceIdentifier"],
                          SkipFinalSnapshot=True,
                      )
                  except rds.exceptions.DBInstanceNotFoundFault:
                      pass
              while time.time() < deadline:
                  try:
                      if not rds.describe_db_clusters(DBClusterIdentifier=cid)["DBClusters"][0]["DBClusterMembers"]:
                          break
                  except rds.exceptions.DBClusterNotFoundFault:
                      return
                  time.sleep(15)
              try:
                  rds.delete_db_cluster(DBClusterIdentifier=cid, SkipFinalSnapshot=True)
              except rds.exceptions.DBClusterNotFoundFault:
                  pass

  AuroraCluster:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt AuroraProvider.Arn
      DBClusterIdentifier: !Ref ClusterName

  ImagesBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:

      # Explicit name so the triggered Lambda can reference it as a string
      # (not !Ref), which breaks the S3-event circular dependency.
      BucketName: !Sub ${AWS::StackName}-images-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # The enrolment trigger. It runs no model: it hands the new object keys to the
  # asynchronous endpoint and returns. A few lines of boto3 package as a zip, so
  # there is no image to build and nothing here to keep in step with the model.
  EmbeddingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: embeddings_handler.lambda_handler
      CodeUri: src/
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SAGEMAKER_ENDPOINT: !Ref EndpointName
          IMAGES_S3_BUCKET: !Sub ${AWS::StackName}-images-${AWS::AccountId}
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub ${AWS::StackName}-images-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action: sagemaker:InvokeEndpointAsync
              Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/${EndpointName}
      Events:

        # only enrolled/ uploads enrol; probes/ objects are matched, not stored
        Enrolled:
          Type: S3
          Properties:
            Bucket: !Ref ImagesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: enrolled/

  # The SageMaker endpoint's execution role. It pulls the serving image, reads the
  # identity images, writes async results back, and fetches the database password.
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: serving
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${AWS::StackName}-images-${AWS::AccountId}
                  - !Sub arn:aws:s3:::${AWS::StackName}-images-${AWS::AccountId}/*

              # The express cluster takes IAM authentication only, so the endpoint
              # mints a short-lived token instead of reading a stored password.
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${AuroraCluster.ClusterResourceId}/${DBUser}
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AsyncTopic

  # Where the endpoint announces that an answer has landed in S3.
  AsyncTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: ch07 KYC async results

  # The status row the applicant's session polls. Keyed by the inference id the client
  # chose when it submitted, so the caller can ask about its own verification without
  # holding an S3 location. Rows expire on their own: a verification outcome is a
  # progress signal, not the record of decision, which lives in the database.
  VerificationsTable:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-verifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: verification_id
          AttributeType: S
      KeySchema:
        - AttributeName: verification_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # SNS cannot write to DynamoDB: its protocols are Lambda, SQS, HTTP/S, email, SMS,
  # mobile push, and Firehose. This subscriber is the hop in between. Fanning out
  # through a topic rather than reacting to the S3 object directly is what lets a
  # second consumer, an audit stream or an ops alarm, subscribe later without touching
  # this function.
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: status_handler.lambda_handler
      CodeUri: src/
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATUS_TABLE: !Ref VerificationsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref VerificationsTable
        - S3ReadPolicy:
            BucketName: !Sub ${AWS::StackName}-images-${AWS::AccountId}
      Events:
        Notification:
          Type: SNS
          Properties:
            Topic: !Ref AsyncTopic

Outputs:
  SageMakerRoleArn:
    Description: execution role for the asynchronous KYC endpoint
    Value: !GetAtt SageMakerExecutionRole.Arn

  SnsTopicArn:
    Value: !Ref AsyncTopic

  StatusTable:
    Description: poll this table for the outcome of a submitted verification
    Value: !Ref VerificationsTable

  ImagesBucket:
    Description: upload identity images here (enrolled/{subject}/ or probes/)
    Value: !Ref ImagesBucket

  DatabaseEndpoint:
    Description: the express Aurora cluster, reachable over its internet gateway
    Value: !GetAtt AuroraCluster.Endpoint

  DatabasePort:
    Value: !GetAtt AuroraCluster.Port

  DBUser:
    Value: !Ref DBUser

  DBName:
    Value: !Ref DBName
