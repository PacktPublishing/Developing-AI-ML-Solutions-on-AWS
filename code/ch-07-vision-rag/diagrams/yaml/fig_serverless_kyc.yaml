# The deployed KYC service, at service level: two paths through one embedder. Enrolment
# runs on an S3 event, verification on a submission the application polls for. The only
# model in the system is the asynchronous GPU endpoint in the middle; both paths reach it.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Client, AWSCloud]

    Client:
      Type: AWS::Diagram::Resource
      Preset: "Mobile client"
      Title: "web or mobile\nonboarding app"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Children: [Ingress, Model, Store]

    # what the application touches: photos in, status out
    Ingress:
      Type: AWS::Diagram::VerticalStack
      Children: [Images, Trigger, Status]
    Images:
      Type: AWS::S3::Bucket
      Title: "S3\nidentity images"
    Trigger:
      Type: AWS::Diagram::Resource
      Preset: "AWS Lambda"
      Title: "enrolment trigger\nno model"
    Status:
      Type: AWS::Diagram::Resource
      Preset: "Amazon DynamoDB"
      Title: "DynamoDB\nverification status"

    # the one embedder, and the topic that announces it is done
    Model:
      Type: AWS::Diagram::VerticalStack
      Children: [Endpoint, Topic, Writer]
    Endpoint:
      Type: AWS::Diagram::Resource
      Preset: "Amazon SageMaker AI"
      Title: "async endpoint\nGPU, scales to zero"
    Topic:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Simple Notification Service (Amazon SNS)"
      Title: "SNS\ncompletion"
    Writer:
      Type: AWS::Diagram::Resource
      Preset: "AWS Lambda"
      Title: "subscriber\nwrites the outcome"

    Store:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Aurora"
      Title: "Aurora Serverless\npgvector, HNSW"

  Links:
    # the upload leaves the top and the poll returns to the side, so the two
    # links use separate corridors instead of stacking on the same one
    - {Source: Client, SourcePosition: N, Target: Images, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal, Labels: {TargetLeft: {Title: "1"}}}
    - {Source: Images, SourcePosition: S, Target: Trigger, TargetPosition: N, TargetArrowHead: {Type: Open}, Labels: {TargetLeft: {Title: "2"}}}
    - {Source: Trigger, SourcePosition: E, Target: Endpoint, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal, Labels: {TargetLeft: {Title: "3"}}}
    - {Source: Endpoint, SourcePosition: E, Target: Store, TargetPosition: W, TargetArrowHead: {Type: Open}, SourceArrowHead: {Type: Open}, Type: orthogonal, Labels: {TargetLeft: {Title: "4"}}}
    - {Source: Endpoint, SourcePosition: S, Target: Topic, TargetPosition: N, TargetArrowHead: {Type: Open}, Labels: {TargetLeft: {Title: "5"}}}
    - {Source: Topic, SourcePosition: S, Target: Writer, TargetPosition: N, TargetArrowHead: {Type: Open}, Labels: {TargetLeft: {Title: "6"}}}
    - {Source: Writer, SourcePosition: W, Target: Status, TargetPosition: E, TargetArrowHead: {Type: Open}, Labels: {TargetLeft: {Title: "7"}}}
    - {Source: Status, SourcePosition: W, Target: Client, TargetPosition: E, TargetArrowHead: {Type: Open}, Type: orthogonal, Labels: {TargetLeft: {Title: "8"}}}
