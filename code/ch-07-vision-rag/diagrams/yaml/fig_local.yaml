# The same KYC loop on your laptop. Compose runs one container, pgvector; enrol.py and match.py
# run on the host and embed on CPU, exactly as the Lambda handlers do. Files stand in for S3.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Host, Compose]

    # The scripts and the face files live on the host; Compose runs only the database.
    # Boxing the host side also drops both lanes clear of the Compose header badge.
    Host:
      Type: AWS::Diagram::Resource
      Preset: "Generic group"
      Direction: horizontal
      Title: "Your laptop (uv run)"
      Children: [Files, Scripts]

    # Column 1 and column 2 are both two-item stacks, so each lane runs dead straight.
    Files:
      Type: AWS::Diagram::VerticalStack
      Children: [Enrolled, Probe]
    Enrolled:
      Type: AWS::Diagram::Resource
      Preset: "Image"
      Title: "enrolled ID photos\nfaces/enrolled/"
    Probe:
      Type: AWS::Diagram::Resource
      Preset: "Image"
      Title: "probe selfie\nfaces/probe/"

    Scripts:
      Type: AWS::Diagram::VerticalStack
      Children: [EnrolPy, MatchPy]
    EnrolPy:
      Type: AWS::Diagram::Resource
      Preset: "Gear"
      Title: "enrol.py\nFaceNet on CPU"
    MatchPy:
      Type: AWS::Diagram::Resource
      Preset: "Gear"
      Title: "match.py\nFaceNet on CPU"

    Compose:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Title: "Docker Compose"
      Children: [Store]
    Store:
      Type: AWS::Diagram::Resource
      Preset: "Postgres"
      Title: "pgvector\nlocalhost:5507"

  Links:
    - {Source: Enrolled, SourcePosition: E, Target: EnrolPy, TargetPosition: W, TargetArrowHead: {Type: Open}}
    - {Source: Probe, SourcePosition: E, Target: MatchPy, TargetPosition: W, TargetArrowHead: {Type: Open}}
    - {Source: EnrolPy, SourcePosition: E, Target: Store, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
    - {Source: MatchPy, SourcePosition: E, Target: Store, TargetPosition: W, TargetArrowHead: {Type: Open}, Type: orthogonal}
