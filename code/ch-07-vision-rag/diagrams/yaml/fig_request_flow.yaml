# One verification request, end to end, in the shape of an AWS reference flow: the app calls
# the HTTP API, the API invokes the search function, and the function queries the private
# pgvector database. The numbered steps are explained in the figure caption.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [App, Cloud]

    App:
      Type: AWS::Diagram::Resource
      Preset: "Mobile client"
      Title: "Web or mobile app"

    Cloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Children: [Api, Vpc]

    Api:
      Type: AWS::Diagram::Resource
      Preset: "Amazon API Gateway"
      Title: "Amazon API Gateway"

    # Search and Db are siblings, so the query and its result run dead straight.
    Vpc:
      Type: AWS::EC2::VPC
      Direction: horizontal
      Title: "Virtual private cloud (VPC)"
      Children: [Search, Db]
    Search:
      Type: AWS::Diagram::Resource
      Preset: "AWS Lambda"
      Title: "AWS Lambda"
    Db:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Relational Database Service (Amazon RDS)"
      Title: "Amazon RDS"

  Links:
    - {Source: App, SourcePosition: NE, Target: Api, TargetPosition: NW, SourceArrowHead: {Type: Open}, TargetArrowHead: {Type: Open}, Type: orthogonal, Labels: {TargetLeft: {Title: "1"}}}
    - {Source: Api, SourcePosition: NE, Target: Search, TargetPosition: NW, SourceArrowHead: {Type: Open}, TargetArrowHead: {Type: Open}, Type: orthogonal, Labels: {TargetLeft: {Title: "2"}}}
    - {Source: Search, SourcePosition: E, Target: Db, TargetPosition: W, SourceArrowHead: {Type: Open}, TargetArrowHead: {Type: Open}, Labels: {SourceRight: {Title: "3"}}}
