# The fraud warehouse as a Grafana datasource, from env so one file serves both worlds:
# locally the vars point at redshift-local; on Fargate they point at Redshift Serverless.
# Grafana's Postgres datasource speaks the Redshift wire protocol on 5439.
apiVersion: 1

datasources:
  - name: warehouse
    uid: warehouse
    type: postgres
    access: proxy
    url: $__env{WAREHOUSE_HOST}:$__env{WAREHOUSE_PORT}
    user: $__env{WAREHOUSE_USER}
    jsonData:
      database: $__env{WAREHOUSE_DB}
      sslmode: $__env{WAREHOUSE_SSLMODE}
      postgresVersion: 1500
    secureJsonData:
      password: $__env{WAREHOUSE_PASSWORD}
    isDefault: true
    editable: true
