name: ch06-fraud

services:
  kinesis:
    # Kinesis Data Streams API served by kinesalite (MIT); boto3 talks to it
    # through endpoint_url, unchanged from real Kinesis on AWS.
    image: saidsef/aws-kinesis-local:latest
    ports:
      - "4567:4567"

  decisions:
    # official DynamoDB Local: the decision store the consumer writes to,
    # key-value lookup of blocks by transaction id
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    ports:
      - "8000:8000"

  s3:
    # S3-compatible store from source: S3Proxy (Apache-2.0) over a filesystem.
    # Firehose's staging area: batches land here before the COPY into the warehouse.
    image: andrewgaul/s3proxy:latest
    environment:
      - S3PROXY_ENDPOINT=http://0.0.0.0:9000
      - S3PROXY_AUTHORIZATION=aws-v2-or-v4
      - S3PROXY_IDENTITY=local
      - S3PROXY_CREDENTIAL=localsecret
      - JCLOUDS_PROVIDER=filesystem
      - JCLOUDS_FILESYSTEM_BASEDIR=/data
    ports:
      - "9000:9000"

  createbuckets:
    # one-shot: wait for S3Proxy, make the chapter's bucket (idempotent), exit
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=localsecret
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 30); do
          aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1 && break; sleep 2;
        done;
        aws --endpoint-url http://s3:9000 s3 mb s3://fraud-analytics 2>/dev/null || true;
        echo "bucket ready"

  warehouse:
    # Redshift-flavored Postgres 16 (reports a Redshift server version); the
    # analytics table the delivery worker COPYes decisions into.
    image: public.ecr.aws/oblako/redshift-local:16
    environment:
      - POSTGRES_USER=analyst
      - POSTGRES_PASSWORD=analyst
      - POSTGRES_DB=fraud
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5439:5439"
    healthcheck:
      # the image fronts Postgres (internal :5433) with a Redshift wire proxy
      # on :5439; probe the engine directly
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U analyst -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    # the fraud desk's incidence board: provisioned datasource (the warehouse) and
    # dashboard, no click-through setup. Anonymous Admin for local viewing; the same
    # dashboard JSON deploys to Grafana on Fargate against Redshift Serverless on AWS.
    image: grafana/grafana:11.2.0
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # the datasource reads these; on Fargate the task sets them from Redshift Serverless
      - WAREHOUSE_HOST=warehouse
      - WAREHOUSE_PORT=5439
      - WAREHOUSE_USER=analyst
      - WAREHOUSE_PASSWORD=analyst
      - WAREHOUSE_DB=fraud
      - WAREHOUSE_SSLMODE=disable
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
