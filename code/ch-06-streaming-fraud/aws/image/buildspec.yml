version: 0.2

# Builds the amd64 scoring image and pushes it to ECR as a Docker v2 manifest (SageMaker
# Serverless runs amd64 and rejects OCI indexes). CodeBuild is amd64, so a plain docker build
# needs no emulation, no buildx driver, and no Docker Hub pull -- the base image comes from
# the ECR public mirror. Developer -> S3 -> CodeBuild -> ECR. On an Apple-silicon laptop the
# local rehearsal (make endpoint-local) runs this same amd64 image under emulation.
phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - echo "Building $IMAGE_URI (amd64)"
      - docker build -t "$IMAGE_URI" .
      - docker push "$IMAGE_URI"
  post_build:
    commands:
      - echo "Done"
