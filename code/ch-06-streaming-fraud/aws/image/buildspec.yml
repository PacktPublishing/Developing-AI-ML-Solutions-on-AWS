version: 0.2

# Builds the scoring container and pushes one multi-arch manifest to ECR:
# amd64 for the endpoint, arm64 for local mode. Developer -> S3 -> CodeBuild -> ECR.
phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - docker run --privileged --rm tonistiigi/binfmt --install arm64
      - docker buildx create --use
  build:
    commands:
      # the endpoint tag: amd64 only, Docker media types; SageMaker rejects
      # OCI image indexes and manifest lists
      - echo "Building $IMAGE_URI (amd64, docker manifest)"
      - docker buildx build --platform linux/amd64 --provenance=false --output "type=image,oci-mediatypes=false,name=$IMAGE_URI,push=true" .
      # the local-mode tag: multi-arch, so an Apple-silicon laptop pulls a
      # native arm64 image for the rehearsal
      - echo "Building ${IMAGE_URI%:*}:local (amd64+arm64)"
      - docker buildx build --platform linux/amd64,linux/arm64 -t "${IMAGE_URI%:*}:local" --push .
  post_build:
    commands:
      - echo "Done"
