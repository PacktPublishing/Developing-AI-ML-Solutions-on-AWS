# The gateway on EKS: one pod that orchestrates the SageMaker endpoints (the same
# ones the ECS path invokes). The models are not in the cluster on AWS — they are
# SageMaker endpoints — so this is the gateway alone. `make deploy COMPUTE=eks`
# swaps the image for the stack's ECR URI and sets imagePullPolicy to Always. The
# pod invokes the endpoints and writes the log through the `gateway` service
# account (its IAM role is created with the cluster).
#
# There is no Ingress here on purpose: eksctl does not install the AWS Load Balancer
# Controller, so an Ingress would sit with no address and no ALB would appear.
# Reaching the pod is deliberately out of scope — `make decide COMPUTE=eks` uses a
# kubectl port-forward. A production ingress on EKS/Fargate needs the AWS Load
# Balancer Controller (its own IAM policy and service account), beyond this chapter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: ch04-decision:local
          imagePullPolicy: Never
          env:
            - name: ENDPOINTS
              value: scorecard=ch04-scorecard,challenger=ch04-challenger
            - name: DECISIONS_TABLE
              value: decision_log
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
