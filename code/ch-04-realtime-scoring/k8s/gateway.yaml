# The gateway on EKS: one pod orchestrating the SageMaker endpoints (the models aren't in the cluster on AWS). `make deploy COMPUTE=eks` swaps in the stack's ECR image and sets imagePullPolicy to Always.
# No Ingress on purpose: eksctl doesn't install the AWS Load Balancer Controller, so `make decide COMPUTE=eks` reaches the pod through a kubectl port-forward instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: ch04-decision:local
          imagePullPolicy: Never
          env:
            - name: ENDPOINTS
              value: scorecard=ch04-scorecard,challenger=ch04-challenger
            - name: DECISIONS_TABLE
              value: decision_log
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            # a deciding model that does not answer inside these bounds refers the
            # application instead of deciding it on partial evidence. Set SHADOW_MODELS
            # to challenger to measure it on live traffic without moving the decision.
            - name: SHADOW_MODELS
              value: ""
            - name: MODEL_TIMEOUT
              value: "2.0"
            - name: MODEL_ATTEMPTS
              value: "2"
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
