# The whole decision service on Kubernetes, locally: the gateway and both models as pods on a k3d cluster, no AWS (on AWS the models are SageMaker endpoints instead, see k8s/gateway.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorecard
spec:
  replicas: 1
  selector:
    matchLabels: { app: scorecard }
  template:
    metadata:
      labels: { app: scorecard }
    spec:
      containers:
        - name: model
          image: ch04-scorecard-model
          imagePullPolicy: Never
          args: ["serve"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scorecard
spec:
  selector: { app: scorecard }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenger
spec:
  replicas: 1
  selector:
    matchLabels: { app: challenger }
  template:
    metadata:
      labels: { app: challenger }
    spec:
      containers:
        - name: model
          image: ch04-challenger-model
          imagePullPolicy: Never
          args: ["serve"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: challenger
spec:
  selector: { app: challenger }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ch04-gateway
          imagePullPolicy: Never
          env:
            - name: ENDPOINTS
              value: scorecard=http://scorecard:8080,challenger=http://challenger:8080
            # a deciding model that does not answer inside these bounds refers the
            # application instead of deciding it on partial evidence. Set SHADOW_MODELS
            # to challenger to measure it on live traffic without moving the decision.
            - name: SHADOW_MODELS
              value: ""
            - name: MODEL_TIMEOUT
              value: "2.0"
            - name: MODEL_ATTEMPTS
              value: "2"
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 80 }
