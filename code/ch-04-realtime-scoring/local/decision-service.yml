name: ch04-decision

services:
  decisions:
    # official DynamoDB Local: the decision log. Every response the service
    # returns is also written here, keyed by application id — the audit
    # trail an adverse-action process reads back.
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    ports:
      - "8000:8000"

  createtable:
    # one-shot: create the decision log table (idempotent), exit
    image: amazon/aws-cli:latest
    depends_on:
      - decisions
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=localsecret
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 30); do
          aws --endpoint-url http://decisions:8000 dynamodb list-tables >/dev/null 2>&1 && break; sleep 2;
        done;
        aws --endpoint-url http://decisions:8000 dynamodb create-table
        --table-name decision_log
        --attribute-definitions AttributeName=application_id,AttributeType=S
        --key-schema AttributeName=application_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST 2>/dev/null || true;
        echo "table ready"

  service:
    # the decision service itself: the same image that runs on Fargate
    image: ch04-service
    build: ../src
    ports:
      - "8080:8000"
    environment:
      - DECISIONS_TABLE=decision_log
      - DYNAMODB_ENDPOINT=http://decisions:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=localsecret
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - decisions
