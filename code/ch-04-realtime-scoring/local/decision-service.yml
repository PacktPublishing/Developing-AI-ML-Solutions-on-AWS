name: ch04-decision

# The decision service's local backing store: DynamoDB Local for the decision log. The two
# models run as concurrent SageMaker local endpoints and the gateway ensembles them; make up
# brings those up from source (src/serve_local.py). On AWS the models are SageMaker endpoints
# and the log is DynamoDB.
services:
  decisions:
    # official DynamoDB Local: the decision log, one row per application with each model's PD alongside the ensemble.
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    ports:
      - "8000:8000"

  createtable:
    # one-shot: create the decision log table (idempotent), exit
    image: amazon/aws-cli:latest
    depends_on:
      - decisions
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=localsecret
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 30); do
          aws --endpoint-url http://decisions:8000 dynamodb list-tables >/dev/null 2>&1 && break; sleep 2;
        done;
        aws --endpoint-url http://decisions:8000 dynamodb create-table
        --table-name decision_log
        --attribute-definitions AttributeName=application_id,AttributeType=S
        --key-schema AttributeName=application_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST 2>/dev/null || true;
        echo "table ready"
