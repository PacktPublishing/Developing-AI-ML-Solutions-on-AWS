name: ch04-decision

# The decision service, local: two model endpoints and the gateway that
# orchestrates them. Each model is a SageMaker bring-your-own container run the
# same way SageMaker would run it — `serve` on 8080, GET /ping and POST
# /invocations — so the laptop and the cloud exercise the identical images. The
# gateway fans a request out to both, averages their PDs, and decides.
services:
  scorecard:
    # the champion model as a local endpoint
    image: ch04-scorecard-model
    build: ../src/models/scorecard
    command: serve
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/ping")
      interval: 5s
      timeout: 3s
      retries: 5

  challenger:
    # the challenger model as a second local endpoint: same contract, different weights
    image: ch04-challenger-model
    build: ../src/models/challenger
    command: serve
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/ping")
      interval: 5s
      timeout: 3s
      retries: 5

  decisions:
    # official DynamoDB Local: the decision log. Every response the gateway
    # returns is also written here, keyed by application id — with each model's
    # PD alongside the ensemble, the audit trail an adverse-action process reads.
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    ports:
      - "8000:8000"

  createtable:
    # one-shot: create the decision log table (idempotent), exit
    image: amazon/aws-cli:latest
    depends_on:
      - decisions
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=localsecret
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 30); do
          aws --endpoint-url http://decisions:8000 dynamodb list-tables >/dev/null 2>&1 && break; sleep 2;
        done;
        aws --endpoint-url http://decisions:8000 dynamodb create-table
        --table-name decision_log
        --attribute-definitions AttributeName=application_id,AttributeType=S
        --key-schema AttributeName=application_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST 2>/dev/null || true;
        echo "table ready"

  gateway:
    # the decision gateway: the same image that runs on Fargate/EKS. It reaches
    # each model on the compose network; ENDPOINTS names them (local URLs here,
    # SageMaker endpoint names in the cloud).
    image: ch04-gateway
    build: ../src/gateway
    ports:
      - "8080:8000"
    environment:
      - ENDPOINTS=scorecard=http://scorecard:8080,challenger=http://challenger:8080
      - DECISIONS_TABLE=decision_log
      - DYNAMODB_ENDPOINT=http://decisions:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=localsecret
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      scorecard:
        condition: service_healthy
      challenger:
        condition: service_healthy
      decisions:
        condition: service_started
      createtable:
        condition: service_completed_successfully
