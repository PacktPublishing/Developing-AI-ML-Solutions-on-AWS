Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [Underwriter, AWSCloud]

    Underwriter:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "Underwriter\nSigV4 request"

    # VPC-less express cluster: the Lambda runs outside a VPC and authenticates to
    # Aurora with a short-lived IAM token, so there is no VPC, secret, or NAT gateway.
    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Children: [Assistant, Services]

    Assistant:
      Type: AWS::Diagram::Resource
      Preset: "LambdaCoin"
      Title: "Lambda\nfunction URL"

    Services:
      Type: AWS::Diagram::VerticalStack
      Children: [Database, Bedrock]

    Database:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Aurora"
      Title: "Aurora Serverless\npgvector (IAM auth)"
    Bedrock:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Bedrock"
      Title: "Bedrock\nConverse + Guardrail"

  Links:
    - {Source: Underwriter, SourcePosition: E, Target: Assistant, TargetPosition: W, TargetArrowHead: {Type: Open}}
    - {Source: Assistant, SourcePosition: E, Target: Database, TargetPosition: W, TargetArrowHead: {Type: Open}}
    - {Source: Assistant, SourcePosition: E, Target: Bedrock, TargetPosition: W, TargetArrowHead: {Type: Open}}
