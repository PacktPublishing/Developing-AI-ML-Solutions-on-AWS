# Local mode: the same Strands underwriting agent, with Ollama standing in for
# Bedrock and a pgvector Postgres container for the RDS vector store. Set
# BEDROCK_LOCAL=1 and the agent runs entirely offline; only the endpoints change.
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/aws-icons-light.yaml
    - Type: LocalFile
      LocalFile: ../../assets/diagrams/defs/custom-icons.yaml
  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children: [User, Local]
    User:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "Underwriter"
    Local:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Title: "Local (Docker + Ollama)"
      Children: [Agent, Tools]
    Agent:
      Type: AWS::Diagram::Resource
      Preset: "Strands"
      Title: "Strands agent\n(BEDROCK_LOCAL=1)"
    Tools:
      Type: AWS::Diagram::VerticalStack
      Children: [Ollama, Vectors]
    Ollama:
      Type: AWS::Diagram::Resource
      Preset: "Ollama"
      Title: "Ollama :11434\n(Amazon Bedrock)"
    Vectors:
      Type: AWS::Diagram::Resource
      Preset: "Postgres"
      Title: "pgvector :5544\n(RDS Postgres)"
  Links:
    - {Source: User, SourcePosition: E, Target: Agent, TargetPosition: W, TargetArrowHead: {Type: Open}}
    - {Source: Agent, SourcePosition: E, Target: Ollama, TargetPosition: W, TargetArrowHead: {Type: Open}}
    - {Source: Agent, SourcePosition: E, Target: Vectors, TargetPosition: W, TargetArrowHead: {Type: Open}}
