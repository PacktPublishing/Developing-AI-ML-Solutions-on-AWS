AWSTemplateFormatVersion: "2010-09-09"

Description: |
  The underwriting assistant on AWS: Aurora PostgreSQL Serverless with pgvector as the vector
  store, and a Lambda that answers a grounded question against Bedrock. The store and the
  retrieval code are the same as the local chapter; only the Postgres host moves to Aurora.
  The cluster is created with express configuration -- a serverless instance and an internet
  access gateway in seconds, runnable on a free-plan account -- through a small inline boto3
  custom resource, because AWS::RDS::DBCluster does not expose express configuration yet
  (coverage-roadmap issue 2506). Express clusters are not in a VPC and take IAM authentication
  only, so the assistant runs outside a VPC and connects with a short-lived RDS auth token
  over TLS: no VPC, subnets, security group, secret, or NAT gateway. Self-contained: the
  Lambda creates the pgvector extension, the table, and the index on its first call, and
  seeds the synthetic knowledge base when the table is empty, so a fresh deploy needs no
  manual SQL and redeploys are idempotent.

Parameters:
  ClusterName:
    Description: the Aurora DB cluster identifier
    Type: String
    Default: ch03-underwriting

  DBUser:
    Description: the cluster master user (express configuration defaults to postgres)
    Type: String
    Default: postgres

  DBName:
    Description: the database the vector store lives in (express default is postgres)
    Type: String
    Default: postgres

  TextModel:
    Type: String
    Default: qwen.qwen3-next-80b-a3b

  EmbedModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0

  GuardrailId:
    Description: |
      Bedrock guardrail id, from `make guardrail` in the chapter (saved to data/guardrail.json). Leave empty to deploy without a guardrail; set it with GuardrailVersion to apply the same guardrail the chapter's ask path uses.
    Type: String
    Default: ""

  GuardrailVersion:
    Description: guardrail version that goes with GuardrailId
    Type: String
    Default: ""

Transform: AWS::Serverless-2016-10-31

Resources:

  # Aurora express configuration has no CloudFormation resource yet, but it is a
  # create_db_cluster parameter (WithExpressConfiguration), so an inline boto3 Lambda custom
  # resource creates the cluster and its serverless instance, not a shell-out to the CLI.
  AuroraProviderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: aurora-express
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:CreateDBCluster
                  - rds:CreateDBInstance
                  - rds:DeleteDBCluster
                  - rds:DeleteDBInstance
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                  - rds:EnableInternetAccessGateway
                  - ec2:DescribeAvailabilityZones
                Resource: '*'
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: rds.amazonaws.com

  AuroraProvider:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt AuroraProviderRole.Arn
      Code:

        # Inline (ZipFile) so cfnresponse is provided by the runtime; boto3 is already there.
        ZipFile: |
          import time
          import boto3
          import cfnresponse

          def handler(event, context):
              rds = boto3.client("rds")
              cid = event["ResourceProperties"]["DBClusterIdentifier"]
              deadline = time.time() + context.get_remaining_time_in_millis() / 1000 - 60
              try:
                  if event["RequestType"] == "Delete":
                      _delete(rds, cid, deadline)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, cid)
                      return
                  if event["RequestType"] == "Create":
                      # one call creates the cluster, a serverless instance, and the gateway
                      rds.create_db_cluster(
                          DBClusterIdentifier=cid,
                          Engine="aurora-postgresql",
                          WithExpressConfiguration=True,
                      )
                  while time.time() < deadline:
                      c = rds.describe_db_clusters(DBClusterIdentifier=cid)["DBClusters"][0]
                      if c["Status"] == "available" and c.get("Endpoint"):
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                              "Endpoint": c["Endpoint"],
                              "Port": str(c["Port"]),
                              "ClusterResourceId": c["DbClusterResourceId"],
                          }, cid)
                          return
                      time.sleep(15)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, cid)
              except Exception as exc:  # always signal, never hang the stack
                  print("error:", exc)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, cid)

          def _delete(rds, cid, deadline):
              try:
                  c = rds.describe_db_clusters(DBClusterIdentifier=cid)["DBClusters"][0]
              except rds.exceptions.DBClusterNotFoundFault:
                  return
              for m in c["DBClusterMembers"]:
                  try:
                      rds.delete_db_instance(
                          DBInstanceIdentifier=m["DBInstanceIdentifier"],
                          SkipFinalSnapshot=True,
                      )
                  except rds.exceptions.DBInstanceNotFoundFault:
                      pass
              while time.time() < deadline:
                  try:
                      if not rds.describe_db_clusters(DBClusterIdentifier=cid)["DBClusters"][0]["DBClusterMembers"]:
                          break
                  except rds.exceptions.DBClusterNotFoundFault:
                      return
                  time.sleep(15)
              try:
                  rds.delete_db_cluster(DBClusterIdentifier=cid, SkipFinalSnapshot=True)
              except rds.exceptions.DBClusterNotFoundFault:
                  pass

  AuroraCluster:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt AuroraProvider.Arn
      DBClusterIdentifier: !Ref ClusterName

  # The assistant runs outside a VPC: the express cluster (over its internet gateway) and
  # Bedrock are both reached over the internet, so no subnets, security groups, or endpoints
  # are needed. It authenticates to Aurora with a short-lived IAM token (DB_IAM_AUTH=1).
  Assistant:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python-uv
    Properties:
      CodeUri: src/
      Handler: handler.answer
      Runtime: python3.12
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          PGHOST: !GetAtt AuroraCluster.Endpoint
          PGPORT: !GetAtt AuroraCluster.Port
          PGUSER: !Ref DBUser
          PGDATABASE: !Ref DBName
          DB_IAM_AUTH: "1"
          TEXT_MODEL: !Ref TextModel
          EMBED_MODEL: !Ref EmbedModel
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:ApplyGuardrail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${AuroraCluster.ClusterResourceId}/${DBUser}

Outputs:
  FunctionUrl:
    Description: the assistant endpoint, sign requests with SigV4
    Value: !GetAtt AssistantUrl.FunctionUrl

  DatabaseEndpoint:
    Description: the Aurora writer endpoint
    Value: !GetAtt AuroraCluster.Endpoint
