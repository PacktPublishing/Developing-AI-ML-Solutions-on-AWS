AWSTemplateFormatVersion: "2010-09-09"

Description: |
  ch-11 monitoring stack: the ECR repository for the scorecard's train/monitor image, a
  CodeBuild project that builds it in-account, and the CloudWatch alarms that watch drift.
  make image uploads the build context and CodeBuild pushes to ECR; make monitor runs a
  SageMaker Processing job (AWS's documented replacement for the closed
  Clarify service) that computes PSI and SHAP feature-attribution drift and publishes
  the metrics to CloudWatch, where these alarms turn them into alerts: a major shift in
  the score distribution (PSI > 0.25), and a fall in the feature-attribution ranking
  agreement (NDCG < 0.90, the threshold Clarify itself used).

Parameters:
  Namespace:
    Description: the CloudWatch namespace the monitoring job publishes to
    Type: String
    Default: ch11/monitoring

Resources:

  # The scorecard's train/monitor image. EmptyOnDelete lets the stack delete cleanly
  # even with images pushed (make image), so teardown is one step.
  ScorecardRepo:
    DeletionPolicy: Delete
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ch11-scorecard
      EmptyOnDelete: true

  # make image uploads the build context here and CodeBuild reads it; the image is built
  # in-account and pushed to ECR, never from the developer's machine.
  SourceBucket:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ch11-image-build
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ScorecardRepo.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${SourceBucket.Arn}/*

  # One image, so a plain build (ch-12's is a batch because it has three). ECR_REGISTRY
  # and IMAGE come from here; the Dockerfile, src/, and entrypoint.sh sit at the zip root.
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ch11-scorecard-build
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/src.zip
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_LARGE
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REGISTRY
            Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          - Name: IMAGE
            Value: ch11-scorecard:latest

  # Score drift: alert when the live score distribution shifts materially from the
  # one the model was trained on. PSI > 0.25 is the standard "major shift" threshold.
  ScoreDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ch11-score-drift
      AlarmDescription: Score PSI exceeded 0.25 (major shift in the score distribution)
      Namespace: !Ref Namespace
      MetricName: score_psi
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: "0.25"
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Feature-attribution drift: alert when the live attribution ranking diverges from
  # the training ranking. Minimum over the period so a single breaching datapoint
  # trips it; missing data is not a breach (no run yet is not an alert).
  AttributionDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ch11-attribution-drift
      AlarmDescription: Clarify feature-attribution NDCG fell below 0.90 (ranking drift)
      Namespace: !Ref Namespace
      MetricName: feature_attribution_ndcg
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: "0.90"
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

  # The jobs and the endpoint run as this role. The chapter owns it, rather than
  # looking for an AmazonSageMaker-ExecutionRole that only exists in an account
  # where someone has opened Studio, which a reader's account may not be.
  SageMakerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ch11-sagemaker-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${SourceBucket}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt SourceBucket.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ScorecardRepo.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*

              # The monitoring job publishes the drift metrics the alarms read.
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'

              # Pipelines runs each step as this role, so the role is what
              # creates the step's job and tags it. The names are generated as
              # pipelines-<execution>-<step>-<hash>, which is as tight as these
              # can be scoped.
              - Effect: Allow
                Action:
                  - sagemaker:CreateTransformJob
                  - sagemaker:DescribeTransformJob
                  - sagemaker:StopTransformJob
                  - sagemaker:CreateProcessingJob
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:StopProcessingJob
                  - sagemaker:AddTags
                  - sagemaker:ListTags
                Resource:
                  - !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:transform-job/pipelines-*
                  - !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:processing-job/pipelines-*

              # A job runs as this role, so this role has to be able to pass it.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/ch11-sagemaker-exec

              # The transform step reads the model the pipeline scores with.
              - Effect: Allow
                Action:
                  - sagemaker:CreateModel
                  - sagemaker:DescribeModel
                  - sagemaker:DeleteModel
                Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:model/*

Outputs:
  RepositoryUri:
    Description: the ECR repository for the scorecard image
    Value: !GetAtt ScorecardRepo.RepositoryUri

  SourceBucket:
    Description: the bucket the build context and the job artifacts both live in
    Value: !Ref SourceBucket

  SageMakerRoleArn:
    Description: the role the pipeline, the monitors and the endpoint run as
    Value: !GetAtt SageMakerRole.Arn

  Alarms:
    Description: the drift alarms the monitoring job feeds
    Value: !Sub ${ScoreDriftAlarm}, ${AttributionDriftAlarm}
