version: 0.2

# One image: build the scorecard's train/serve/monitor container and push it to ECR.
# ECR_REGISTRY and IMAGE come from the CodeBuild project; the build context (Dockerfile,
# src/, entrypoint.sh) sits at the zip root beside this file.
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build -t "$ECR_REGISTRY/$IMAGE" .
  post_build:
    commands:
      - docker push "$ECR_REGISTRY/$IMAGE"
